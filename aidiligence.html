)}.`,`Two of the seller's seven addbacks I rejected outright: "one-time recruiting" appears in all three years, and "IT consulting" traces to the seller's own entity.`],cites:["CIM - Project Cascade.pdf p. 18","401(k) Census & Plan Docs FY25.pdf pp. 3–7","Customer Revenue Detail by Month FY23-FY25.xlsx","AR Aging Detail 12.31.25.xlsx"],chart:"gap"},{id:"tax",chip:"What did the tax returns say that the P&L didn't?",keywords:["tax","return","1120s","m-1","nexus","idaho","book-to-tax","state"],headline:`Three things. An unfiled state, a ${ce(d0)} book-to-tax difference that reconciles cleanly, and an S-corp history that makes an F-reorg worth roughly ${we(Zn.stepUpAmortAnnual*Gi.taxRate*5)} of cash tax over a five-year hold.`,paras:[`The gap that matters is an absence. There is no Idaho return in the data room in any year, but the payroll register puts three employees at Idaho addresses since 2022 and Basin Ag Cooperative revenue is Idaho-sourced. Payroll creates nexus. Because nothing was ever filed, the statute of limitations has never started running, so the exposure is open-ended rather than capped at three years. I estimate ${ce(118e3)}.`,`Oregon CAT returns were filed late for FY23 and FY24 and understate OR-sourced activity of roughly $2.9M — ${ce(46e3)}. Washington B&O has managed-services revenue reported under Retailing at 0.471% instead of Service & Other Activities at 1.75% — ${ce(92e3)}. Total quantified exposure ${ce(Ir)}.`,`The M-1 itself is clean and I want to be fair about that: ${ce(268e3)} of §179 and bonus depreciation over book, ${ce(31e3)} of meals disallowance, ${ce(41e3)} of accrued bonus caught by §461(h). It ties. Nothing is hiding in the reconciliation.`,`One thing the returns confirm that helps you: valid S-corp election since 2009, single member. An F-reorganisation lets the seller roll ${Ze(Gi.rolloverPct)} tax-deferred while you take a stepped-up basis of ${ce(Zn.stepUpBasis)} on the purchased portion, amortised over 15 years — ${ce(Zn.years[0].stepUpShield)} a year of cash tax shield, roughly ${we(Zn.stepUpAmortAnnual*Gi.taxRate*5)} of it inside a five-year hold. That is switched on in the LBO tab and you can toggle it off to see what it is worth.`],cites:["Federal Return 1120S FY23/FY24/FY25.pdf — Schedule M-1","State Returns WA-OR-ID FY23-FY25.pdf — no ID filings found","Payroll Register FY25.xlsx"],chart:"nexus"}],NX={id:"nomatch",chip:"Not in the data room",headline:"That is not something the data room answers, and I am not going to guess at it.",paras:["I only assert things I can trace to one of the 23 documents. Nothing I ingested speaks to that question, so the honest answer is that I do not know.","What I can answer from these documents: the quality-of-earnings bridge and every addback in it; revenue quality, retention and contract status by client; working capital and the closing peg; the balance sheet, funded debt and lease obligations; federal and state tax exposure; and the live LBO, including stress cases. The suggested questions below are all fully grounded.","If the underlying document exists, add it to the room and ask again — the analysis rebuilds from the source, not from a script."],cites:["No supporting document found in the data room"],chart:null};function CX(e,t){const n=e.toLowerCase().trim();if(!n)return null;if(t==="chip"){const o=Rs.find(s=>s.chip===e);if(o)return{item:o,exact:!0,score:1/0}}let r=null,i=0,a=0;for(const o of Rs){let s=0,l=0;for(const c of o.keywords)n.includes(c)&&(s+=3+c.length/10,l++);const u=o.chip.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(c=>c.length>3),d=new Set(n.replace(/[^a-z0-9 ]/g," ").split(/\s+/));for(const c of u)d.has(c)&&(s+=1);s>i&&(i=s,r=o,a=l)}return!r||i<3?{item:NX,exact:!0,score:i,noMatch:!0}:{item:r,exact:a>=2&&i>=8,score:i}}const Ee=["#3987e5","#d95926","#199e70","#c98500","#d55181","#9085e9"],Rp={managed:Ee[0],cloud:Ee[1],security:Ee[2],voice:Ee[3],proserv:Ee[4],hardware:Ee[5]},st={good:"#4ec98d",warn:"#e8b755",bad:
