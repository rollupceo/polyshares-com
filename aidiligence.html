ller, not a settled fact — it is finding #12.`],cites:["Monthly P&L Detail FY23-FY25.xlsx — 36 periods","FY23-FY25 Annual P&L (Consolidated).xlsx","Payroll Register FY25.xlsx"],chart:"gmAttr",chartData:MX},{id:"relparty",chip:"Show me every dollar of related-party spend.",keywords:["related party","related-party","family payroll","owner comp","keller","personal expense","related party spend"],headline:`${Y(TA)} of FY25 spend runs through the seller or entities and people connected to him. ${Y(IX)} of it is above market or has no business purpose.`,paras:["Seven streams. I found them by joining the payroll register to the org chart and the ticketing user list, the AP ledger to the operating agreement's related-party schedule, and the OCR'd card statements back to the GL.",`The rent is the structurally important one. Cascade pays ${Y(te.FY25.opexDetail.rent)} a year to Cascade Holdings LLC, which R. Keller owns outright — $18.00/sq ft NNN against a $12.00 Tacoma flex comp set. The lease expires in 2027 with no renewal option, so unless a new arm's-length lease is signed before closing, the buyer negotiates from inside the building.`,`One item nets to zero: Keller Digital LLC invoiced ${Y(42e3)} of "IT consulting." The hours are real and the work would otherwise be bought outside, so it is a genuine cost — but it is a related-party contract that must be terminated or papered at close.`,`${Y(899e3)} of this flows into the QoE bridge as addbacks. The ${Y(132e3)} rent excess is in there too, at Medium confidence pending a broker opinion.`],cites:["Payroll Register FY25.xlsx","Cap Table & Operating Agreement.pdf p. 22","Real Property Lease - 4200 Marine View Dr.pdf","Bank Statements FY25 (12 mo).pdf — OCR","AP Aging Detail 12.31.25.xlsx"],chart:"relParty"},{id:"top3",chip:"What happens to IRR if we lose the top 3 clients?",anchors:["top client","largest client","biggest client","client concentrat","customer concentrat","top 3","top three"],keywords:["top 3","top three","lose the top","losing the top","concentrat","customer concentrat","customer base","stress case","irr if","if we lose","client loss","top client","largest client","biggest client","client concentrat"],headline:`IRR goes from ${le(ge.irr)} to ${yr.irr===null?"negative":le(yr.irr)} and the credit breaks in year one. Minimum DSCR falls to ${yr.minDscr.toFixed(2)}x.`,paras:[`The top three — Sound Health Partners, Evergreen School District 114, Northwest Timber Holdings — are ${Y(qi.slice(0,3).reduce((e,t)=>e+t.revenue,0))}, or ${le(Gi)} of revenue.`,`I re-ran the live model with that revenue removed permanently from year one at a 38% contribution margin, which is the right number here: the service desk and the NOC do not shrink 24% because three logos leave. Year-one EBITDA falls from ${Y(ge.years[0].ebitda)} to ${Y(yr.years[0].ebitda)}.`,`Senior leverage on entry is ${ge.entryLeverage.toFixed(2)}x. Under the stress it is ${yr.years[0].seniorLeverage.toFixed(2)}x by the end of year one, against a covenant that would typically be set at 3.75x with a step-down. Minimum DSCR of ${yr.minDscr.toFixed(2)}x is below 1.0x — the company cannot service the debt out of cash flow.`,"This is not a tail scenario. The largest of the three has been month-to-month since March 2024, and the second is a school district with a mandatory re-bid. That is why finding #1 is Critical and why the structure should carry a larger seller note or an earnout tied to the Sound Health renewal."],cites:["Customer Revenue Detail by Month FY23-FY25.xlsx","Top 20 Client Contracts (executed).pdf","Live LBO model — stress run"],chart:"stress",chartData:[{label:"Base case",irr:ge.irr,moic:ge.moic,dscr:ge.minDscr},{label:"Lose top 3",irr:Math.max(0,(Pw=yr.irr)!=null?Pw:0),moic:($w=yr.moic)!=null?$w:0,dscr:yr.minDscr}]},{id:"recurring",chip:"Is the recurring revenue actually recurring?",keywords:["recurring","contracted","month-to-month","mtm","arr","mrr","monthly recurring","annual recurring","sticky","contract","contracts","expire","expiry","expiration","clients","client contract","churn","retention","nrr","grr","renewal","stickiness","attrition"],headline:`${le(te.FY25.recurringPct)} of revenue is recurring in character. Only ${le(1-Lr)} of it is actually under contract — ${Y(Lt[0].amount)} is month-to-month.`,paras:[`Two different questions get answered with the same number in the CIM. Recurring by revenue type: ${Y(te.FY25.recurring)} of managed services, cloud, security and voice, versus ${Y(te.FY25.nonRecurring)} of projects and hardware. That part checks out and it has improved — ${le(te.FY23.recurringPct)} in FY23 to ${le(te.FY25.recurringPct)} in FY25.`,`Recurring by contract is a different story. ${Y(Lt[0].amount)} — ${le(Lr)} of the recurring base — sits on expired or month-to-month terms, and that includes the single largest client at ${le(ca)} of total revenue. Another ${Y(Lt[1].amount)} expires within twelve months.`,"The MSA template itself carries a 90-day termination-for-convenience right, so even the contracted revenue is a 90-day promise rather than a 36-month one.",`The retention data is genuinely good and I would not undersell it: NRR ${le(ru)}, GRR ${le(Vi)}, and the pre-2020 cohort still grew. Cascade keeps clients. But "we keep them" and "they are contracted" are not the same underwriting fact, and the price should reflect which one you are buying.`],cites:["Top 20 Client Contracts (executed).pdf — 20 executed MSAs","MSA Template & Service Schedules.docx","Customer Revenue Detail by Month FY23-FY25.xlsx"],chart:"ladder"},{id:"inflate",chip:"Where is the seller most likely inflating EBITDA?",keywords:["inflat","overstat","aggressive addback","seller inflat","ebitda gap","quality of earnings","addback","overstated ebitda","padding"],headline:`The CIM's ${Y(ie.bankerAdjEbitda)} is ${Y(gt)} too high. At the 8.0x ask that is ${me(gt*ie.askMultiple)} of purchase price.`,paras:["The inflation is not in the addbacks the CIM shows — most of those are legitimate and I accepted them. It is in what the CIM leaves out. Five run-rate costs are missing entirely.",`Largest: ${Y(178e3)} of gross profit from ${Y(135e4)} of one-time hardware refresh work for Evergreen SD 114 and Sound Health. Both are documented multi-year replacement cycles in the client contracts. Presenting that as run-rate is the single most aggressive item in the book.`,`Then ${Y(64e3)} of unfunded 401(k) safe-harbor match that is mandatory under the plan document and was never expensed, accrued, or deposited; ${Y(52e3)} of contracted RMM/PSA price increase already executed for 1/1/2026; ${Y(85e3)} for the controller the business does not have; and ${Y(38e3)} of normalised bad debt against a >90 bucket that grew to ${Y(31e4)} with no allowance.`,`I also haircut the owner-comp addback by ${Y(6e4)} — the CIM normalises to a $325K CEO; the Service Leadership and ConnectWise comp studies put an ${me(te.FY25.revenue)} MSP at ${Y(385e3)}.`,`Two of the seller's seven addbacks I rejected outright: "one-time recruiting" appears in all three years, and "IT consulting" traces to the seller's own entity.`],cites:["CIM - Project Cascade.pdf p. 18","401(k) Census & Plan Docs FY25.pdf pp. 3–7","Customer Revenue Detail by Month FY23-FY25.xlsx","AR Aging Detail 12.31.25.xlsx"],chart:"gap"},{id:"tax",chip:"What did the tax returns say that the P&L didn't?",keywords:["tax return","1120s","m-1","nexus","idaho","book-to-tax","state tax","tax exposure","tax risk","tax liability","f-reorg","step-up","s-corp","sales tax"],headline:`Three things. An unfiled state, a ${Y(vg)} book-to-tax difference that reconciles cleanly, and an S-corp history that makes an F-reorg worth roughly ${me(ge.stepUpAmortAnnual*Xi.taxRate*5)} of cash tax over a five-year hold.`,paras:[`The gap that matters is an absence. There is no Idaho return in the data room in any year, but the payroll register puts three employees at Idaho addresses since 2022 and Basin Ag Cooperative revenue is Idaho-sourced. Payroll creates nexus. Because nothing was ever filed, the statute of limitations has never started running, so the exposure is open-ended rather than capped at three years. I estimate ${Y(118e3)}.`,`Oregon CAT returns were filed late for FY23 and FY24 and understate OR-sourced activity of roughly $2.9M — ${Y(46e3)}. Washington B&O has managed-services revenue reported under Retailing at 0.471% instead of Service & Other Activities at 1.75% — ${Y(92e3)}. Total quantified exposure ${Y(hr)}.`,`The M-1 itself is clean and I want to be fair about that: ${Y(268e3)} of §179 and bonus depreciation over book, ${Y(31e3)} of meals disallowance, ${Y(41e3)} of accrued bonus caught by §461(h). It ties. Nothing is hiding in the reconciliation.`,`One thing the returns confirm that helps you: valid S-corp election since 2009, single member. An F-reorganisation lets the seller roll ${le(Xi.rolloverPct)} tax-deferred while you take a stepped-up basis of ${Y(ge.stepUpBasis)} on the purchased portion, amortised over 15 years — ${Y(ge.years[0].stepUpShield)} a year of cash tax shield, roughly ${me(ge.stepUpAmortAnnual*Xi.taxRate*5)} of it inside a five-year hold. That is switched on in the LBO tab and you can toggle it off to see what it is worth.`],cites:["Federal Return 1120S FY23/FY24/FY25.pdf — Schedule M-1","State Returns WA-OR-ID FY23-FY25.pdf — no ID filings found","Payroll Register FY25.xlsx"],chart:"nexus"}],jw=[{id:"f-adjebitda",anchors:["adjusted ebitda","adj ebitda","normalised ebitda","normalized ebitda","run-rate ebitda"],chip:"What is Adjusted EBITDA?",tab:"Quality of earnings",keywords:["adjusted ebitda","adj ebitda","what is ebitda","ebitda number","normalised ebitda","normalized ebitda","run-rate ebitda"],headline:`Adjusted EBITDA is ${Y(Jt)} — a ${le(Yl)} margin on ${me(ae.revenue)} of FY25 revenue.`,paras:[`Reported FY25 EBITDA is ${Y(ae.ebitda)} (${le(ae.ebitdaPct)}). The bridge adds ${Y(1176e3)} of genuine owner and one-time items and removes ${Y(417e3)} of run-rate costs the P&L does not carry.`,`The CIM presents ${Y(ie.bankerAdjEbitda)}. Every dollar of the ${Y(gt)} difference is itemised on the Quality of earnings tab, each with a source reference and a confidence tag.`],cites:["FY23-FY25 Annual P&L (Consolidated).xlsx","QoE bridge — 11 items"]},{id:"f-peg",anchors:["working capital peg","nwc peg","nwc target","working capital target","net working capital"],chip:"What is the working capital peg?",tab:"Working capital",keywords:["working capital peg","nwc peg","the peg","net working capital","nwc target","working capital target","working capital"],not:["seasonal"],headline:`The peg is ${Y(Er)}, set on the twelve-month average. Closing NWC is ${Y(iu)}.`,paras:[`That is a ${Y(fr)} purchase price adjustment payable to the seller on the face of it. But ${Y(yt[3].amount)} of the receivable inside that balance is over 90 days old with no allowance booked.`,`Exclude the aged bucket from the calculation — the position in condition (e) of the IC memo — and the adjustment flips to ${Y(fr-yt[3].amount)} in the buyer's favour. DSO ran ${Se[0].dso} → ${Se[11].dso} days over FY25 and DPO ${Se[0].dpo} → ${Se[11].dpo}, both one way.`],cites:["AR Aging Detail 12.31.25.xlsx","AP Aging Detail 12.31.25.xlsx","Balance Sheets FY23-FY25.xlsx"]},{id:"f-ar90",anchors:["over 90","aged receivable","ar aging","receivable over","90 day","uncollectible"],chip:"How much AR is over 90 days?",tab:"Working capital",keywords:["over 90","past due","aged receivable","ar aging","uncollectible","bad debt","receivable over","90 day"],not:[" ap ","accounts payable","payable","vendor","we owe"],headline:`${Y(yt[3].amount)} sits over 90 days — ${le(yt[3].pct)} of ${Y(fa)} of gross AR, with no allowance booked anywhere in the trial balance.`,paras:[`${Y(186e3)} of it is a single Harbor Logistics dispute over a one-off datacentre migration billed outside the MSA, unpaid since February 2025. ${Y(58e3)} is a client that entered Chapter 11 in September 2025. ${Y(34e3)} is a partial dispute over off-boarding fees.`,`Cascade expenses write-offs as incurred rather than reserving, which is why the QoE bridge carries a ${Y(38e3)} normalised bad-debt charge. The aged balance itself is a closing balance sheet issue, handled in the peg — it is not double counted.`],cites:["AR Aging Detail 12.31.25.xlsx","Trial Balance 12.31.25.xlsx"]},{id:"f-debt",anchors:["net debt","funded debt","off balance sheet","off-balance-sheet","capital lease","debt capacity"],chip:"How much debt is on the balance sheet?",tab:"Balance sheet & debt",keywords:["net debt","funded debt","how much debt","debt capacity","leverage capacity","off balance sheet","off-balance-sheet","capital lease"],headline:`Funded debt is ${Y(hg)} against ${Y(kf)} of cash — ${Y(PA)} net. Diligence found another ${Y(ri)} that is not on the balance sheet.`,paras:[`On balance sheet: a ${Y(4e5)} line of credit, ${Y(1108e3)} of term debt including the current portion, and ${Y(486e3)} of finance leases. Deferred revenue is ${Y(da.liabilities.find(e=>e.label==="Deferred revenue").amount)} and ties to the contract rollforward.`,`Off balance sheet: five schedules in the equipment file meet ASC 842 finance-lease criteria but are expensed as operating, plus a ${Y(138e3)} residual due April 2027. That is a real price reduction the seller has not seen coming — and worth confirming whether any carry a personal guarantee.`],cites:["Balance Sheets FY23-FY25.xlsx","Equipment & Vehicle Lease Schedule.xlsx","Deferred Revenue & Contract Rollforward.xlsx"]},{id:"f-deferred",anchors:["deferred revenue","unearned revenue","billings in advance"],chip:"What is the deferred revenue balance?",tab:"Balance sheet & debt",keywords:["deferred revenue","unearned revenue","billings in advance","prepaid contracts"],headline:`Deferred revenue is ${Y(da.liabilities.find(e=>e.label==="Deferred revenue").amount)} at 12/31/2025, and it ties to the contract rollforward.`,paras:["It is annually-prepaid managed-services contracts billed in advance — a genuine liability the buyer inherits and must deliver against, and one of the reasons Cascade runs on modest net working capital.",`It sits inside the ${Y(Er)} peg as a deduction, so a swing in prepayment behaviour between signing and closing moves the purchase price. Worth asking whether the seller has been accelerating annual prepayments into the pre-close period.`],cites:["Deferred Revenue & Contract Rollforward.xlsx","Balance Sheets FY23-FY25.xlsx"]},{id:"f-litigation",anchors:["litigation","lawsuit","reyes","employment claim","employment litigation","staff litigation","wrongful termination","legal settlement"],chip:"Is there any litigation?",tab:"Quality of earnings",keywords:["litigation","lawsuit","legal claim","reyes","employment claim","employment litigation","staff litigation","wrongful termination","legal settlement","sued","epli"],headline:`One settled matter: a ${Y(ae.opexDetail.settlement)} wrongful-termination settlement with a former field engineer (M. Reyes), booked in August 2025. The pattern behind it matters more than the amount.`,paras:["The settlement agreement is executed and released, and the EPLI carrier denied coverage on a late-notice exclusion — so it was paid in cash out of FY25 earnings. It is added back in the QoE bridge at High confidence as genuinely non-recurring.","But the loss runs show two further employment claims in FY22–FY23. Three in four years at 84 employees is a pattern, not an accident, and it belongs in the reps and warranties discussion rather than the addback schedule. The late-notice denial also suggests the claims-reporting process is weak, which is a diligence item for the insurance broker.",`Separately: Harbor Logistics is disputing ${Y(186e3)} of project invoices, which sits in the >90-day receivable rather than in litigation. Confirm whether that dispute is in mediation.`],cites:["Insurance Schedule & Loss Runs.pdf, p. 14","GL 6510; Monthly P&L Detail — Aug-25","AR Aging Detail 12.31.25.xlsx"]},{id:"f-dso",anchors:["dso","dpo","days sales outstanding","days payable","collection period"],chip:"What are DSO and DPO doing?",tab:"Working capital",keywords:["dso","dpo","days sales outstanding","days payable","collection period","how fast do they collect","payment terms"],headline:`DSO went ${Se[0].dso.toFixed(1)} → ${Se[11].dso.toFixed(1)} days across FY25 and DPO ${Se[0].dpo.toFixed(1)} → ${Se[11].dpo.toFixed(1)}. Both moved one way, every month.`,paras:[`Receivables slowed by ${(Se[11].dso-Se[0].dso).toFixed(1)} days and payables stretched by ${(Se[11].dpo-Se[0].dpo).toFixed(1)}. Neither touches EBITDA, and together they flatter reported cash in the year the business is being sold.`,"A monotonic trend across twelve consecutive months is not noise. It reverses after close, which is a real cash cost to the buyer in year one, and it is why the peg is set on a twelve-month average rather than the closing balance.","Ask what changed in collection policy or vendor terms in the last 18 months, and request any vendor correspondence about extended terms. This is finding #13."],cites:["AR Aging Detail 12.31.25.xlsx","AP Aging Detail 12.31.25.xlsx","Monthly P&L Detail FY23-FY25.xlsx"]},{id:"f-flags",anchors:["red flag","biggest risk","what are the risks","diligence issues"],chip:"What are the biggest red flags?",tab:"Red flags",keywords:["red flag","biggest risk","what are the risks","main issues","deal breaker","what should i worry","diligence issues","walk away"],headline:`${Hl.length} ranked findings: ${CX()}. The critical one is that the largest client has no contract.`,paras:[`Sound Health Partners is ${le(ca)} of revenue and its MSA expired 3/31/2024 — month-to-month for 21 months with no renewal in the room. Then: the ${Y(gt)} EBITDA overstatement, a trial balance that did not tie, ${Y(hr)} of state tax exposure with no statute running in Idaho, and ${le(Lr)} of "recurring" revenue on month-to-month terms.`,"Every finding carries a quantified impact where one exists, the source document, and a drafted question for the seller. The full list and the question set are on the Red flags tab."],cites:["13 findings, each with a source citation"]},{id:"f-people",anchors:["management team","org chart","headcount","key person","how many employees"],chip:"Who runs the business?",tab:"Red flags",keywords:["management team","headcount","how many employees","org chart","key person","who runs","staff","employees"],not:["idaho","oregon","washington","nexus","litigation","lawsuit"],headline:`${ie.employees} employees across 7 functions. There is no COO and no second-in-command, and the seller is 61 and retiring at close.`,paras:[$X.map(e=>`${e.fn} ${e.n}`).join(" · ")+".",`That is finding #11 and it is a real one: two senior engineers own the technical relationship with 9 of the top 10 accounts, and non-competes are on file for only 2 of 8 senior staff. The payroll register also carries two names — the seller's spouse and son — that appear on no org chart, no ticketing user list and no PTO schedule, which is ${Y(pg)} of the QoE bridge.`],cites:["Org Chart & Headcount Roster.xlsx","Payroll Register FY25.xlsx"]},{id:"f-price",anchors:["asking price","what are they asking","purchase price","what should we pay","what is it worth"],chip:"What are they asking, and what should we pay?",tab:"LBO model",keywords:["asking price","what are they asking","valuation","what should we pay","purchase price","enterprise value","what is it worth","the ask"],not:["cfo","controller","salary","wage","real estate","lease"],headline:`The seller is asking ${Pe(ie.askMultiple,1)} on the CIM's ${Y(ie.bankerAdjEbitda)} — ${me(ie.askMultiple*ie.bankerAdjEbitda)}. On our ${Y(Jt)} the same multiple is ${me(ie.askMultiple*Jt)}.`,paras:[`The LBO tab models ${Pe(ge.p.entryMultiple,2)} on Adjusted EBITDA — ${me(ge.ev)} of enterprise value, which is ${Pe(ge.impliedEntryOnReported,1)} on reported EBITDA. That produces a ${le(ge.irr)} IRR and a ${ge.moic.toFixed(2)}x MOIC over ${ge.hold} years with a minimum DSCR of ${ge.minDscr.toFixed(2)}x.`,`The gap between the two numbers is the negotiation: ${Y(gt)} of EBITDA is ${me(gt*ie.askMultiple)} of price at the ask. Every input on the LBO tab is live — drive it yourself.`],cites:["CIM - Project Cascade.pdf p. 18","Live LBO model"]},{id:"f-sources",anchors:["cash at close","cash at closing","sources and uses","sponsor equity","equity check","equity cheque"],chip:"What does the equity cheque look like?",tab:"LBO model",keywords:["cash at close","cash at closing","at closing","how much cash","sources and uses","equity check","equity cheque","sponsor equity","how much do we write","wired at close"],headline:`At ${Pe(ge.p.entryMultiple,2)} the sponsor writes ${Y(ge.sponsorEquity)} of equity and ${Y(ge.cashConsideration)} is wired to the seller at closing.`,paras:[`Sources: ${Y(ge.seniorDebt)} senior term loan at ${le(ge.p.seniorRate,2)}, a ${Y(ge.sellerNote)} seller note, ${Y(ge.rollover)} of seller rollover, and ${Y(ge.sponsorEquity)} of sponsor equity as the plug. Uses: ${Y(ge.cashConsideration)} cash to the seller, the note and rollover issued non-cash, and ${Y(ge.fees)} of transaction fees at ${le(ge.p.feePct,1)} of enterprise value.`,`Sources equal uses at ${Y(ge.totalSources)}. Every one of those inputs is a slider on the LBO tab — change the structure and the sources, the debt schedule, the returns and the IC memo all move with it.`],cites:["Live LBO model — sources & uses"]},{id:"f-capex",anchors:["capex","capital expenditure","cash conversion","free cash flow"],chip:"What does capex and cash conversion look like?",tab:"LBO model",keywords:["capex","capital expenditure","cash conversion","free cash flow","fcf"],headline:`Capex runs at ${le(ge.p.capexPct,1)} of revenue in the model — ${Y(ge.years[0].capex)} in year one — against D&A of ${le(ge.p.daPct,1)}.`,paras:[`MSPs are asset-light: the spend is NOC hardware, engineering laptops and the vehicle fleet. Year-one cash flow available for debt
