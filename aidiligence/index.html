 (Consolidated).xlsx","Payroll Register FY25.xlsx"],chart:"gmAttr",chartData:CX},{id:"relparty",chip:"Show me every dollar of related-party spend.",keywords:["related party","related-party","family payroll","owner comp","keller","personal expense","related party spend"],headline:`${H(EA)} of FY25 spend runs through the seller or entities and people connected to him. ${H(MX)} of it is above market or has no business purpose.`,paras:["Seven streams. I found them by joining the payroll register to the org chart and the ticketing user list, the AP ledger to the operating agreement's related-party schedule, and the OCR'd card statements back to the GL.",`The rent is the structurally important one. Cascade pays ${H(te.FY25.opexDetail.rent)} a year to Cascade Holdings LLC, which R. Keller owns outright — $18.00/sq ft NNN against a $12.00 Tacoma flex comp set. The lease expires in 2027 with no renewal option, so unless a new arm's-length lease is signed before closing, the buyer negotiates from inside the building.`,`One item nets to zero: Keller Digital LLC invoiced ${H(42e3)} of "IT consulting." The hours are real and the work would otherwise be bought outside, so it is a genuine cost — but it is a related-party contract that must be terminated or papered at close.`,`${H(899e3)} of this flows into the QoE bridge as addbacks. The ${H(132e3)} rent excess is in there too, at Medium confidence pending a broker opinion.`],cites:["Payroll Register FY25.xlsx","Cap Table & Operating Agreement.pdf p. 22","Real Property Lease - 4200 Marine View Dr.pdf","Bank Statements FY25 (12 mo).pdf — OCR","AP Aging Detail 12.31.25.xlsx"],chart:"relParty"},{id:"top3",chip:"What happens to IRR if we lose the top 3 clients?",keywords:["top 3","top three","lose the top","losing the top","concentrat","stress case","irr if","if we lose","client loss","top client","largest client","biggest client","client concentrat"],headline:`IRR goes from ${le(ge.irr)} to ${yr.irr===null?"negative":le(yr.irr)} and s:[`Two different questions get answered with the same number in the CIM. Recurring by revenue type: ${H(te.FY25.recurring)} of managed services, cloud, security and voice, versus ${H(te.FY25.nonRecurring)} of projects and hardware. That part checks out and it has improved — ${le(te.FY23.recurringPct)} in FY23 to ${le(te.FY25.recurringPct)} in FY25.`,`Recurring by contract is a different story. ${H(Lt[0].amount)} — ${le(Lr)} of the recurring base — sits on expired or month-to-month terms, and that includes the single largest client at ${le(ca)} of total revenue. Another ${H(Lt[1].amount)} expires within twelve months.`,"The MSA template itself carries a 90-day termination-for-convenience right, so even the contracted revenue is a 90-day promise rather than a 36-month one.",`The retention data is genuinely good and I would not undersell it: NRR ${le(ru)}, GRR ${le(Vi)}, and the pre-2020 cohort still grew. Cascade keeps clients. But "we keep them" and "they are contracted" are not the same underwriting fact, and the price should reflect which one you are buying.`],cites:["Top 20 Client Contracts (executed).pdf — 20 executed MSAs","MSA Template & Service Schedules.docx","Customer Revenue Detail by Month FY23-FY25.xlsx"],chart:"ladder"},{id:"inflate",chip:"Where is the seller most likely inflating EBITDA?",keywords:["inflat","overstat","aggressive addback","seller inflat","ebitda gap","quality of earnings","addback","overstated ebitda","padding"],headline:`The CIM's ${H(ie.bankerAdjEbitda)} is ${H(gt)} too high. At the 8.0x ask that is ${me(gt*ie.askMultiple)} of purchase price.`,paras:["The inflation is not in the addbacks the CIM shows — most of those are legitimate and I accepted them. It is in what the CIM leaves out. Five run-rate costs are missing entirely.",`Largest: ${H(178e3)} of gross profit from ${H(135e4)} of one-time hardware refresh work for Evergreen SD 114 and Sound Health. Both are documented multi-year replacement cycles in the client contracts. Presenting that as run-rate is the single most aggressive item in the book.`,`Then ${H(64e3)} of unfunded 401(k) safe-harbor match that is mandatory under the plan document and was never expensed, accrued, or deposited; ${H(52e3)} of contracted RMM/PSA price increase already executed for 1/1/2026; ${H(85e3)} for the controller the business does not have; and ${H(38e3)} of normalised bad debt against a >90 bucket that grew to ${H(31e4)} with no allowance.`,`I also haircut the owner-comp addback by ${H(6e4)} — the CIM normalises to a $325K CEO; the Service Leadership and ConnectWise comp studies put an ${me(te.FY25.revenue)} MSP at ${H(385e3)}.`,`Two of the seller's seven addbacks I rejected outright: "one-time recruiting" appears in all three years, and "IT consulting" traces to the seller's own entity.`],cites:["CIM - Project Cascade.pdf p. 18","401(k) Census & Plan Docs FY25.pdf pp. 3–7","Customer Revenue Detail by Month FY23-FY25.xlsx","AR Aging Detail 12.31.25.xlsx"],chart:"gap"},{id:"tax",chip:"What did the tax returns say that the P&L didn't?",keywords:["tax return","1120s","m-1","nexus","idaho","book-to-tax","state tax","tax exposure","tax risk","tax liability","f-reorg","step-up","s-corp","sales tax"],headline:`Three things. An unfiled state, a ${H(v0)} book-to-tax difference that reconciles cleanly, and an S-corp history that makes an F-reorg worth roughly ${me(ge.stepUpAmortAnnual*Xi.taxRate*5)} of cash tax over a five-year hold.`,paras:[`The gap that matters is an absence. There is no Idaho return in the data room in any year, but the payroll register puts three employees at Idaho addresses since 2022 and Basin Ag Cooperative revenue is Idaho-sourced. Payroll creates nexus. Because nothing was ever filed, the statute of limitations has never started running, so the exposure is open-ended rather than capped at three years. I estimate ${H(118e3)}.`,`Oregon CAT returns were filed late for FY23 and FY24 and understate OR-sourced activity of roughly $2.9M — ${H(46e3)}. Washington B&O has managed-services revenue reported under Retailing at 0.471% instead of Service & Other Activities at 1.75% — ${H(92e3)}. Total quantified exposure ${H(hr)}.`,`The M-1 itself is clean and I want to be fair about that: ${H(268e3)} of §179 and bonus depreciation over book, ${H(31e3)} of meals disallowance, ${H(41e3)} of accrued bonus caught by §461(h). It ties. Nothing is hiding in the reconciliation.`,`One thing the returns confirm that helps you: valid S-corp election since 2009, single member. An F-reorganisation lets the seller roll ${le(Xi.rolloverPct)} tax-deferred while you take a stepped-up basis of ${H(ge.stepUpBasis)} on the purchased portion, amortised over 15 years — ${H(ge.years[0].stepUpShield)} a year of cash tax shield, roughly ${me(ge.stepUpAmortAnnual*Xi.taxRate*5)} of it inside a five-year hold. That is switched on in the LBO tab and you can toggle it off to see what it is worth.`],cites:["Federal Return 1120S FY23/FY24/FY25.pdf — Schedule M-1","State Returns WA-OR-ID FY23-FY25.pdf — no ID filings found","Payroll Register FY25.xlsx"],chart:"nexus"}],jw=[{id:"f-adjebitda",anchors:["adjusted ebitda","adj ebitda","normalised ebitda","normalized ebitda","run-rate ebitda"],chip:"What is Adjusted EBITDA?",tab:"Quality of earnings",keywords:["adjusted ebitda","adj ebitda","what is ebitda","ebitda number","normalised ebitda","normalized ebitda","run-rate ebitda"],headline:`Adjusted EBITDA is ${H(Jt)} — a ${le(Yl)} margin on ${me(ae.revenue)} of FY25 revenue.`,paras:[`Reported FY25 EBITDA is ${H(ae.ebitda)} (${le(ae.ebitdaPct)}). The bridge adds ${H(1176e3)} of genuine owner and one-time items and removes ${H(417e3)} of run-rate costs the P&L does not carry.`,`The CIM presents ${H(ie.bankerAdjEbitda)}. Every dollar of the ${H(gt)} difference is itemised on the Quality of earnings tab, each with a source reference and a confidence tag.`],cites:["FY23-FY25 Annual P&L (Consolidated).xlsx","QoE bridge — 11 items"]},{id:"f-peg",anchors:["working capital peg","nwc peg","nwc target","working capital target","net working capital"],chip:"What is the working capital peg?",tab:"Working capital",keywords:["working capital peg","nwc peg","the peg","net working capital","nwc target","working capital target","working capital"],not:["seasonal"],headline:`The peg is ${H(Er)}, set on the twelve-month average. Closing NWC is ${H(iu)}.`,paras:[`That is a ${H(fr)} purchase price adjustment payable to the seller on the face of it. But ${H(yt[3].amount)} of the receivable inside that balance is over 90 days old with no allowance booked.`,`Exclude the aged bucket from the calculation — the position in condition (e) of the IC memo — and the adjustment flips to ${H(fr-yt[3].amount)} in the buyer's favour. DSO ran ${Ge[0].dso} → ${Ge[11].dso} days over FY25 and DPO ${Ge[0].dpo} → ${Ge[11].dpo}, both one way.`],cites:["AR Aging Detail 12.31.25.xlsx","AP Aging Detail 12.31.25.xlsx","Balance Sheets FY23-FY25.xlsx"]},{id:"f-ar90",anchors:["over 90","aged receivable","ar aging","receivable over","90 day","uncollectible"],chip:"How much AR is over 90 days?",tab:"Working capital",keywords:["over 90","past due","aged receivable","ar aging","uncollectible","bad debt","receivable over","90 day"],not:[" ap ","accounts payable","payable","vendor","we owe"],headline:`${H(yt[3].amount)} sits over 90 days — ${le(yt[3].pct)} of ${H(fa)} of gross AR, with no allowance booked anywhere in the trial balance.`,paras:[`${H(186e3)} of it is a single Harbor Logistics dispute over a one-off datacentre migration billed outside the MSA, unpaid since February 2025. ${H(58e3)} is a client that entered Chapter 11 in September 2025. ${H(34e3)} is a partial dispute over off-boarding fees.`,`Cascade expenses write-offs as incurred rather than reserving, which is why the QoE bridge carries a ${H(38e3)} normalised bad-debt charge. The aged balance itself is a closing balance sheet issue, handled in the peg — it is not double counted.`],cites:["AR Aging Detail 12.31.25.xlsx","Trial Balance 12.31.25.xlsx"]},{id:"f-debt",anchors:["net debt","funded debt","deferred revenue","off balance sheet","off-balance-sheet","capital lease","debt capacity"],chip:"How much debt is on the balance sheet?",tab:"Balance sheet & debt",keywords:["net debt","funded debt","how much debt","debt capacity","leverage capacity","off balance sheet","off-balance-sheet","capital lease"],headline:`Funded debt is ${H(h0)} against ${H(kf)} of cash — ${H(AA)} net. Diligence found another ${H(ri)} that is not on the balance sheet.`,paras:[`On balance sheet: a ${H(4e5)} line of credit, ${H(1108e3)} of term debt including the current portion, and ${H(486e3)} of finance leases. Deferred revenue is ${H(da.liabilities.find(e=>e.label==="Deferred revenue").amount)} and ties to the contract rollforward.`,`Off balance sheet: five schedules in the equipment file meet ASC 842 finance-lease criteria but are expensed as operating, plus a ${H(138e3)} residual due April 2027. That is a real price reduction the seller has not seen coming — and worth confirming whether any carry a personal guarantee.`],cites:["Balance Sheets FY23-FY25.xlsx","Equipment & Vehicle Lease Schedule.xlsx","Deferred Revenue & Contract Rollforward.xlsx"]},{id:"f-deferred",anchors:["deferred revenue","unearned revenue","billings in advance"],chip:"What is the deferred revenue balance?",tab:"Balance sheet & debt",keywords:["deferred revenue","unearned revenue","billings in advance","prepaid contracts"],headline:`Deferred revenue is ${H(da.liabilities.find(e=>e.label==="Deferred revenue").amount)} at 12/31/2025, and it ties to the contract rollforward.`,paras:["It is annually-prepaid managed-services contracts billed in advance — a genuine liability the buyer inherits and must deliver against, and one of the reasons Cascade runs on modest net working capital.",`It sits inside the ${H(Er)} peg as a deduction, so a swing in prepayment behaviour between signing and closing moves the purchase price. Worth asking whether the seller has been accelerating annual prepayments into the pre-close period.`],cites:["Deferred Revenue & Contract Rollforward.xlsx","Balance Sheets FY23-FY25.xlsx"]},{id:"f-flags",anchors:["red flag","biggest risk","what are the risks","diligence issues"],chip:"What are the biggest red flags?",tab:"Red flags",keywords:["red flag","biggest risk","what are the risks","main issues","deal breaker","what should i worry","diligence issues","walk away"],headline:`${Hl.length} ranked findings: ${NX()}. The critical one is that the largest client has no contract.`,paras:[`Sound Health Partners is ${le(ca)} of revenue and its MSA expired 3/31/2024 — month-to-month for 21 months with no renewal in the room. Then: the ${H(gt)} EBITDA overstatement, a trial balance that did not tie, ${H(hr)} of state tax exposure with no statute running in Idaho, and ${le(Lr)} of "recurring" revenue on month-to-month terms.`,"Every finding carries a quantified impact where one exists, the source document, and a drafted question for the seller. The full list and the question set are on the Red flags tab."],cites:["13 findings, each with a source citation"]},{id:"f-people",anchors:["management team","org chart","headcount","key person","how many employees"],chip:"Who runs the business?",tab:"Red flags",keywords:["management team","headcount","how many employees","org chart","key person","who runs","staff","employees"],not:["idaho","oregon","washington","nexus","litigation","lawsuit"],headline:`${ie.employees} employees across 7 functions. There is no COO and no second-in-command, and the seller is 61 and retiring at close.`,paras:[PX.map(e=>`${e.fn} ${e.n}`).join(" · ")+".",`That is finding #11 and it is a real one: two senior engineers own the technical relationship with 9 of the top 10 accounts, and non-competes are on file for only 2 of 8 senior staff. The payroll register also carries two names — the seller's spouse and son — that appear on no org chart, no ticketing user list and no PTO schedule, which is ${H(p0)} of the QoE bridge.`],cites:["Org Chart & Headcount Roster.xlsx","Payroll Register FY25.xlsx"]},{id:"f-price",anchors:["asking price","what are they asking","purchase price","what should we pay","what is it worth"],chip:"What are they asking, and what should we pay?",tab:"LBO model",keywords:["asking price","what are they asking","valuation","what should we pay","purchase price","enterprise value","what is it worth","the ask"],not:["cfo","controller","salary","wage","real estate","lease"],headline:`The seller is asking ${Ne(ie.askMultiple,1)} on the CIM's ${H(ie.bankerAdjEbitda)} — ${me(ie.askMultiple*ie.bankerAdjEbitda)}. On our ${H(Jt)} the same multiple is ${me(ie.askMultiple*Jt)}.`,paras:[`The LBO tab models ${Ne(ge.p.entryMultiple,2)} on Adjusted EBITDA — ${me(ge.ev)} of enterprise value, which is ${Ne(ge.impliedEntryOnReported,1)} on reported EBITDA. That produces a ${le(ge.irr)} IRR and a ${ge.moic.toFixed(2)}x MOIC over ${ge.hold} years with a minimum DSCR of ${ge.minDscr.toFixed(2)}x.`,`The gap between the two numbers is the negotiation: ${H(gt)} of EBITDA is ${me(gt*ie.askMultiple)} of price at the ask. Every input on the LBO tab is live — drive it yourself.`],cites:["CIM - Project Cascade.pdf p. 18","Live LBO model"]},{id:"f-sources",anchors:["cash at close","cash at closing","sources and uses","sponsor equity","equity check","equity cheque"],chip:"What does the equity cheque look like?",tab:"LBO model",keywords:["cash at close","cash at closing","at closing","how much cash","sources and uses","equity check","equity cheque","sponsor equity","how much do we write","wired at close"],headline:`At ${Ne(ge.p.entryMultiple,2)} the sponsor writes ${H(ge.sponsorEquity)} of equity and ${H(ge.cashConsideration)} is wired to the seller at closing.`,paras:[`Sources: ${H(ge.seniorDebt)} senior term loan at ${le(ge.p.seniorRate,2)}, a ${H(ge.sellerNote)} seller note, ${H(ge.rollover)} of seller rollover, and ${H(ge.sponsorEquity)} of sponsor equity as the plug. Uses: ${H(ge.cashConsideration)} cash to the seller, the note and rollover issued non-cash, and ${H(ge.fees)} of transaction fees at ${le(ge.p.feePct,1)} of enterprise value.`,`Sources equal uses at ${H(ge.totalSources)}. Every one of those inputs is a slider on the LBO tab — change the structure and the sources, the debt schedule, the returns and the IC memo all move with it.`],cites:["Live LBO model — sources & uses"]},{id:"f-capex",anchors:["capex","capital expenditure","cash conversion","free cash flow"],chip:"What does capex and cash conversion look like?",tab:"LBO model",keywords:["capex","capital expenditure","cash conversion","free cash flow","fcf"],headline:`Capex runs at ${le(ge.p.capexPct,1)} of revenue in the model — ${H(ge.years[0].capex)} in year one — against D&A of ${le(ge.p.daPct,1)}.`,paras:[`MSPs are asset-light: the spend is NOC hardware, engineering laptops and the vehicle fleet. Year-one cash flow available for debt service is ${H(ge.years[0].cfads)} against ${H(ge.years[0].mandatory)} of mandatory amortisation, and 50% of the surplus sweeps to the term loan.`,`Working capital consumes ${le(ge.p.nwcPctIncRev,1)} of incremental revenue. Both are editable on the LBO tab.`],cites:["Live LBO model — 5-year projection and debt schedule"]},{id:"f-growth",anchors:["how fast is it growing","revenue growth","how big is the company"],chip:"How fast is it growing?",tab:"Revenue quality",keywords:["how fast is it growing","growth rate","revenue growth","top line","how big is the company","what is the revenue"],not:["per employee","per head","per seat","addressable","market size","tam","competitor"],headline:`FY25 revenue is ${H(ae.revenue)}, up ${le(ae.revenue/te.FY24.revenue-1)} on FY24 and ${le(Math.pow(ae.revenue/te.FY23.revenue,.5)-1)} compound over two years.`,paras:[`${H(te.FY23.revenue)} → ${H(te.FY24.revenue)} → ${H(ae.revenue)}. Recurring revenue grew faster than the total, from ${le(te.FY23.recurringPct)} of the mix to ${le(ae.recurringPct)}, and December-25 MRR of ${H(Id)} annualises to ${me(Dd)}.`,`The quality question is not growth, it is durability: ${le(Lr)} of the recurring base is on month-to-month terms. Growth also came with margin volatility — gross margin ran ${le(te.FY23.gmPct)} → ${le(te.FY24.gmPct)} → ${le(te.FY25.gmPct)}.`],cites:["Monthly P&L Detail FY23-FY25.xlsx","Customer Revenue Detail by Month FY23-FY25.xlsx"]},{id:"f-retention",anchors:["customer churn","logo churn","net revenue retention","gross retention","how bad is the churn","do they keep clients"],chip:"How bad is the churn?",tab:"Revenue quality",keywords:["how bad is the churn","customer churn","logo churn","net revenue retention","gross retention","do they keep clients","attrition rate"],not:["employee","staff","engineer","headcount","turnover of"],headline:`Retention is genuinely good: NRR ${le(ru)} and GRR ${le(Vi)}. Churn is not this deal's problem — contract status is.`,paras:[`Across five onboarding cohorts, revenue went from ${H(d0)} to ${H(jA)}. Gross retention of ${le(Vi)} implies roughly ${le(1-Vi)} of annual revenue churn, offset by expansion in every cohort including the oldest — the 2020-and-earlier group still grew.`,`So Cascade keeps its clients. But "we keep them" and "they are contracted" are different underwriting facts: ${H(Lt[0].amount)} of recurring revenue sits on expired or month-to-month terms, including the largest account at ${le(ca)} of total revenue.`],cites:["Customer Revenue Detail by Month FY23-FY25.xlsx — 36 monthly cohorts","Top 20 Client Contracts (executed).pdf"]}],IX={id:"nomatch",chip:"Not in the data room",headline:"That is not something the data room answers, and I am not going to guess at it.",paras:["I only assert things I can trace to one of the 23 documents. Nothing I ingested speaks to that question, so the honest answer is that I do not know.","What I can answer from these documents: the quality-of-earnings bridge and every addback in it; revenue qua
