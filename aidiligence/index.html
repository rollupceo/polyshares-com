d wages, not pricing.`,paras:[`Gross profit went ${ce(te.FY23.grossProfit)} → ${ce(te.FY24.grossProfit)} on revenue that grew ${Ze(te.FY24.revenue/te.FY23.revenue-1)}. I decomposed the ${Ka} bps against the monthly detail and the service-line COGS build.`,`The largest driver is mix: hardware and licensing resale grew to ${ce(te.FY24.lines.find(e=>e.id==="hardware").revenue)} — ${Ze(te.FY24.lines.find(e=>e.id==="hardware").revenue/te.FY24.revenue)} of revenue — at an ${Ze(te.FY24.lines.find(e=>e.id==="hardware").gmPct)} margin. Pass-through dollars flatter the top line and dilute the percentage.`,`Second is labour. A 9.5% engineering wage adjustment landed in July 2024 and was not passed to clients until the January 2025 price increase, so FY24 absorbed six months of cost with no price. Managed-services margin fell ${Ze(te.FY23.lines[0].gmPct)} → ${Ze(te.FY24.lines[0].gmPct)}.`,`FY25 recovered to ${Ze(te.FY25.gmPct)}, but that recovery is one year old and rests on a price increase with no churn evidence behind it yet. That is a diligence question for the seller, not a settled fact — it is finding #12.`],cites:["Monthly P&L Detail FY23-FY25.xlsx — 36 periods","FY23-FY25 Annual P&L (Consolidated).xlsx","Payroll Register FY25.xlsx"],chart:"gmAttr",chartData:kX},{id:"relparty",chip:"Show me every dollar of related-party spend.",keywords:["related party","related-party","family","owner","seller spend","keller","personal"],headline:`${ce(OA)} of FY25 spend runs through the seller or entities and people connected to him. ${ce(_X)} of it is above market or has no business purpose.`,paras:["Seven streams. I found them by joining the payroll register to the org chart and the ticketing user list, the AP ledger to the operating agreement's related-party schedule, and the OCR'd card statements back to the GL.",`The rent is the structurally important one. Cascade pays ${ce(te.FY25.opexDetail.rent)} a year to Cascade Holdings LLC, which R. Keller owns outright — $18.00/sq ft NNN against a $12.00 Tacoma flex comp set. The lease expires in 2027 with no renewal option, so unless a new arm's-length lease is signed before closing, the buyer negotiates from inside the building.`,`One item nets to zero: Keller Digital LLC invoiced ${ce(42e3)} of "IT consulting." The hours are real and the work would otherwise be bought outside, so it is a genuine cost — but it is a related-party contract that must be terminated or papered at close.`,`${ce(899e3)} of this flows into the QoE bridge as addbacks. The ${ce(132e3)} rent excess is in there too, at Medium confidence pending a broker opinion.`],cites:["Payroll Register FY25.xlsx","Cap Table & Operating Agreement.pdf p. 22","Real Property Lease - 4200 Marine View Dr.pdf","Bank Statements FY25 (12 mo).pdf — OCR","AP Aging Detail 12.31.25.xlsx"],chart:"relParty"},{id:"top3",chip:"What happens to IRR if we lose the top 3 clients?",keywords:["top 3","top three","lose the top","largest clients","concentration","stress case","irr if"],headline:`IRR goes from ${Ze(Xn.irr)} to ${pr.irr===null?"negative":Ze(pr.irr)} and the credit breaks in year one. Minimum DSCR falls to ${pr.minDscr.toFixed(2)}x.`,paras:[`The top three — Sound Health Partners, Evergreen School District 114, Northwest Timber Holdings — are ${ce(ko.slice(0,3).reduce((e,t)=>e+t.revenue,0))}, or ${Ze(Wi)} of revenue.`,`I re-ran the live model with that revenue removed permanently from year one at a 38% contribution margin, which is the right number here: the service desk and the NOC do not shrink 24% because three logos leave. Year-one EBITDA falls from ${ce(Xn.years[0].ebitda)} to ${ce(pr.years[0].ebitda)}.`,`Senior leverage on entry is ${Xn.entryLeverage.toFixed(2)}x. Under the stress it is ${pr.years[0].seniorLeverage.toFixed(2)}x by the end of year one, against a covenant that would typically be set at 3.75x with a step-down. Minimum DSCR of ${pr.minDscr.toFixed(2)}x is below 1.0x — the company cannot service the debt out of cash flow.`,"This is not a tail scenario. The largest of the three has been month-to-month since March 2024, and the second is a school district with a mandatory re-bid. That is why finding #1 is Critical and why the structure should carry a larger seller note or an earnout tied to the Sound Health renewal."],cites:["Customer Revenue Detail by Month FY23-FY25.xlsx","Top 20 Client Contracts (executed).pdf","Live LBO model — stress run"],chart:"stress",chartData:[{label:"Base case",irr:Xn.irr,moic:Xn.moic,dscr:Xn.minDscr},{label:"Lose top 3",irr:Math.max(0,(gw=pr.irr)!=null?gw:0),moic:(xw=pr.moic)!=null?xw:0,dscr:pr.minDscr}]},{id:"recurring",chip:"Is the recurring revenue actually recurring?",keywords:["recurring","contracted","month-to-month","mtm","arr","mrr","sticky","contract","churn","retention","nrr","grr","renewal","stickiness","attrition"],headline:`${Ze(te.FY25.recurringPct)} of revenue is recurring in character. Only ${Ze(1-oa)} of it is actually under contract — ${ce(Ht[0].amount)} is month-to-month.`,paras:[`Two different questions get answered with the same number in the CIM. Recurring by revenue type: ${ce(te.FY25.recurring)} of managed services, cloud, security and voice, versus ${ce(te.FY25.nonRecurring)} of projects and hardware. That part checks out and it has improved — ${Ze(te.FY23.recurringPct)} in FY23 to ${Ze(te.FY25.recurringPct)} in FY25.`,`Recurring by contract is a different story. ${ce(Ht[0].amount)} — ${Ze(oa)} of the recurring base — sits on expired or month-to-month terms, and that includes the single largest client at ${Ze(Ml)} of total revenue. Another ${ce(Ht[1].amount)} expires within twelve months.`,"The MSA template itself carries a 90-day termination-for-convenience right, so even the contracted revenue is a 90-day promise rather than a 36-month one.",`The retention data is genuinely good and I would not undersell it: NRR ${Ze(Ad)}, GRR ${Ze(kd)}, and the pre-2020 cohort still grew. Cascade keeps clients. But "we keep them" and "they are contracted" are
