<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polyshares CRM</title>
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="X-Content-Type-Options" content="nosniff" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<script>try{if(self!==top){document.documentElement.style.display='none';top.location=self.location.href;}}catch(e){document.documentElement.style.display='none';}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="/favicon.ico?v=2" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
<style>
:root{--paper:#F7F5F0;--paper2:#EFECE4;--paper3:#E7E3D9;--ink:#16140F;--ink2:#4A463C;--muted:#6E6858;--line:#DDD8CC;--line2:#D0CABD;--dark:#16140F;--accent:#4A6FA5;--green:#5E8C61;--red:#A55050;--gold:#8a6d0b;--serif:'Fraunces',serif;--sans:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button{font-family:var(--sans);cursor:pointer}
input,select,textarea{font-family:var(--sans);font-size:14px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
a{color:var(--accent)}
.btn{background:var(--ink);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-weight:500;font-size:13.5px}
.btn:hover{opacity:.88}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--paper3);color:var(--ink2)}
.tag.green{background:rgba(94,140,97,.16);color:var(--green)}
.tag.gold{background:rgba(201,162,39,.16);color:var(--gold)}
.tag.red{background:rgba(165,80,80,.14);color:var(--red)}
.muted{color:var(--muted)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark);position:relative;overflow:hidden}
#login::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 480px at 50% -10%, rgba(74,111,165,.22), transparent 60%);pointer-events:none}
#login .card{position:relative;background:var(--paper);border-radius:14px;padding:40px 38px;width:392px;max-width:92vw;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.loginbrand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.loginbrand svg{width:30px;height:30px;color:var(--ink)}
.loginbrand .wm{font-family:var(--serif);font-size:22px;font-weight:500}
.loginbrand .wm small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-top:1px}
#login h1{font-family:var(--serif);font-weight:400;font-size:23px;margin-bottom:4px}
#login .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
#login input{width:100%;margin-bottom:12px}
#login .btn{width:100%;background:var(--accent);border-color:var(--accent);font-size:15px;padding:12px}
#login .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
#login .alt{margin-top:14px;text-align:center;font-size:13px}

/* app shell */
#app{display:none;min-height:100vh}
header{position:sticky;top:0;z-index:30;background:var(--dark);color:#fff;display:flex;align-items:center;gap:22px;padding:0 20px;height:54px}
header .brand{font-family:var(--serif);font-size:18px;display:flex;align-items:center;gap:8px;flex-shrink:0}
header .brand svg{width:20px;height:20px}
header nav{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
header nav::-webkit-scrollbar{display:none}
header nav button{background:none;border:none;color:rgba(255,255,255,.65);padding:8px 12px;border-radius:6px;font-size:13.5px;white-space:nowrap;flex-shrink:0}
header nav button.on{background:rgba(255,255,255,.14);color:#fff}
header .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12.5px;color:rgba(255,255,255,.72);flex-shrink:0}
main{padding:22px;max-width:1500px;margin:0 auto}
.viewhead{margin-bottom:18px}
.viewhead h2{font-family:var(--serif);font-weight:400;font-size:26px}
.viewhead .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
.view{display:none}.view.on{display:block}

/* KPI tiles */
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:170px;flex:1}
.kpi .pl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .pn{font-family:var(--serif);font-size:26px;margin-top:3px}
.kpi .ps{font-size:11.5px;color:var(--muted);margin-top:2px}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{background:var(--paper2);border:1px solid var(--line);border-radius:12px;min-width:270px;width:270px;flex:none}
.col h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:12px 14px 8px;display:flex;justify-content:space-between}
.col .cnt{color:var(--muted);font-weight:500}
.col .cards{padding:0 10px 12px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 240px);overflow-y:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--ink)}
.card .co{font-weight:600;font-size:13.5px}
.card .sub{color:var(--muted);font-size:12px;margin-top:1px}
.card .val{color:var(--green);font-weight:600;font-size:13px;margin-top:5px}

/* panels + tables */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.panel h3{font-family:var(--serif);font-weight:500;font-size:17px;margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px}
.tbl td{border-bottom:1px solid var(--paper2);padding:9px 10px}
.tbl tr:hover td{background:var(--paper)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.right-actions{display:flex;gap:8px;justify-content:flex-end}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty .big{font-family:var(--serif);font-size:20px;color:var(--ink2);margin-bottom:4px}

/* drawer */
#drawerback{display:none;position:fixed;inset:0;background:rgba(20,18,14,.4);z-index:40}
#drawer{position:fixed;top:0;right:0;height:100vh;width:640px;max-width:96vw;background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .22s;box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .head{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
#drawer .head h2{font-family:var(--serif);font-weight:400;font-size:22px;padding-right:30px}
#drawer .x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:24px;color:var(--muted)}
#drawer .body{padding:20px 22px 60px;overflow-y:auto}
.fld{margin-bottom:11px;font-size:13px}
.fld b{display:inline-block;width:120px;color:var(--muted);font-weight:500}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.pill{font-size:12px;padding:7px 11px;border-radius:7px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.pill.done{background:var(--paper3);color:var(--ink2)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.pill.next{cursor:pointer}.pill.next:hover{border-color:var(--ink)}
.feed{margin-top:6px}
.feed .ev{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--paper2);font-size:13px}
.feed .ev .ic{width:22px;flex:none;text-align:center}
.feed .ev .tm{color:var(--muted);font-size:11.5px;margin-left:auto;flex:none}
.section-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}

/* toast + gate */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:9px;opacity:0;transition:all .25s;z-index:100;font-size:13.5px;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#gate{display:none;position:fixed;inset:0;background:var(--paper);z-index:60;overflow-y:auto;padding:40px 20px}
#gate .wrap{max-width:640px;margin:0 auto}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.q .opt{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-top:7px;cursor:pointer}
.q .opt:hover{border-color:var(--ink)}
.q .opt.sel{border-color:var(--accent);background:rgba(74,111,165,.08)}
@media(max-width:700px){main{padding:14px}#drawer{width:100vw}.kpi{min-width:44%}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="loginbrand"><svg viewBox="0 0 96 96" fill="none" aria-hidden="true"><rect x="18" y="18" width="42" height="42" stroke="currentColor" stroke-width="7"/><rect x="36" y="36" width="42" height="42" stroke="currentColor" stroke-width="7"/><path d="M60 28V44" stroke="currentColor" stroke-width="7"/></svg><div class="wm">Polyshares<small>CRM</small></div></div>
    <h1>Sign in</h1>
    <div class="sub">Data-licensing deal platform.</div>
    <input id="lg_email" type="email" placeholder="you@company.com" autocomplete="username" />
    <input id="lg_pass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')($('lg_btn').click())" />
    <button class="btn" id="lg_btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="lg_err"></div>
    <div class="alt"><a href="#" onclick="sendMagic();return false">Email me a magic link instead</a></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand"><svg viewBox="0 0 96 96" fill="none"><rect x="18" y="18" width="42" height="42" stroke="currentColor" stroke-width="7"/><rect x="36" y="36" width="42" height="42" stroke="currentColor" stroke-width="7"/></svg> Polyshares</div>
    <nav id="nav"></nav>
    <div class="right"><span id="whoami"></span><button class="btn sm ghost" style="color:#fff;border-color:rgba(255,255,255,.25)" onclick="doLogout()">Log out</button></div>
  </header>
  <main id="main"></main>
</div>

<div id="drawerback" onclick="closeDrawer()"></div>
<div id="drawer"><div class="head"><button class="x" onclick="closeDrawer()">×</button><h2 id="dTitle"></h2><div class="muted" id="dSub" style="font-size:13px;margin-top:2px"></div></div><div class="body" id="dBody"></div></div>
<div class="toast" id="toast"></div>

<div id="gate"><div class="wrap">
  <div class="loginbrand"><div class="wm" style="font-family:var(--serif);font-size:22px">Product certification</div></div>
  <p class="muted" style="margin:6px 0 18px">You must pass the product test before you can work deals.</p>
  <div id="gateBody"></div>
</div></div>

<script src="./vendor/supabase.js"></script>
<script>
/* ============================ config + client ============================ */
const SUPABASE_URL = 'https://naayxogekfnmxsqkfqek.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BuR8RD0tKTH7n6deWeUwcQ_Y78xmHUU'; // browser-safe; RLS protects data
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });

let me = null;         // {id,email,role|kind,...}
let stages = [];       // pipeline_stage rows
let leads = [];        // current scope
let curLead = null;
const $ = (id)=>document.getElementById(id);
const money = (n)=> n==null?'—':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const esc = (s)=> String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }

/* ============================ auth ============================ */
async function doLogin(){
  $('lg_err').textContent='';
  const email=$('lg_email').value.trim(), password=$('lg_pass').value;
  if(!email||!password){ $('lg_err').textContent='Enter email and password.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $('lg_err').textContent=error.message; return; }
  boot();
}
async function sendMagic(){
  const email=$('lg_email').value.trim();
  if(!email){ $('lg_err').textContent='Enter your email first.'; return; }
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.href } });
  $('lg_err').textContent = error ? error.message : '';
  if(!error) toast('Magic link sent — check your email.');
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
async function doSignup(){
  $('lg_err').style.color='var(--red)'; $('lg_err').textContent='';
  const email=$('lg_email').value.trim(), password=$('lg_pass').value;
  if(!email||password.length<8){ $('lg_err').textContent='Enter your email and a password (8+ characters).'; return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ $('lg_err').textContent=error.message; return; }
  const code=localStorage.getItem('pendingInvite');
  if(data.session){
    if(code){ const { error:ae } = await sb.rpc('accept_invite',{p_code:code}); if(ae){ $('lg_err').textContent=ae.message; return; } localStorage.removeItem('pendingInvite'); }
    boot();
  } else {
    $('lg_err').style.color='var(--ink2)';
    $('lg_err').textContent='Account created — check your email to confirm, then sign in here.';
  }
}

async function loadMe(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user) return null;
  let { data:au } = await sb.from('app_user').select('*').eq('id',user.id).maybeSingle();
  if(au){ return { ...au, email:au.email||user.email, internal:true }; }
  let { data:eu } = await sb.from('external_portal_user').select('*').eq('id',user.id).maybeSingle();
  if(eu){ return { ...eu, email:eu.email||user.email, internal:false, role:eu.kind }; }
  return { id:user.id, email:user.email, role:null, internal:false, orphan:true };
}

/* ============================ role → nav/views ============================ */
const NAV = {
  admin:        ['board','accounting','commission','admin'],
  sales_manager:['board','commission'],
  sales_rep:    ['board','commission'],
  fulfillment_ops:['board'],
  accounting:   ['accounting'],
  broker:       ['portal'],
  offtaker:     ['portal'],
};
const VIEW_LABEL = { board:'Pipeline', accounting:'Accounting', commission:'Commission', admin:'Admin', portal:'My Portal' };

async function boot(){
  me = await loadMe();
  // freshly-signed-up invitee with no profile yet → provision from stored invite
  if(me && me.orphan){
    const code=localStorage.getItem('pendingInvite');
    if(code){ try{ await sb.rpc('accept_invite',{p_code:code}); localStorage.removeItem('pendingInvite'); me=await loadMe(); }catch(e){} }
  }
  if(!me){ $('login').style.display='flex'; $('app').style.display='none'; return; }
  if(me.orphan){ await sb.auth.signOut(); $('login').style.display='flex'; $('app').style.display='none'; $('lg_err').textContent='This account has no workspace access. Use your invite link, or contact an admin.'; return; }
  $('login').style.display='none'; $('app').style.display='block';
  $('whoami').textContent = (me.full_name||me.email) + ' · ' + roleLabel(me.role);

  // cert gate for reps/managers/brokers
  if(['sales_rep','sales_manager','broker'].includes(me.role)){
    const { data:cert } = await sb.rpc('is_certified');
    if(!cert){ return showGate(); }
  }
  const { data:st } = await sb.from('pipeline_stage').select('*').order('sort_order');
  stages = st||[];
  buildNav();
  const views = NAV[me.role]||['portal'];
  show(views[0]);
}
function roleLabel(r){ return ({admin:'Admin',sales_manager:'Sales Manager',sales_rep:'Sales Rep',fulfillment_ops:'Fulfillment',accounting:'Accounting',broker:'Broker',offtaker:'Data Offtaker',rep:'Sales Rep',manager:'Sales Manager'}[r])||'—'; }
function buildNav(){
  const views = NAV[me.role]||['portal'];
  $('nav').innerHTML = views.map(v=>`<button data-v="${v}" onclick="show('${v}')">${VIEW_LABEL[v]}</button>`).join('');
}
function show(v){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  const m=$('main'); m.innerHTML='';
  if(v==='board') renderBoard();
  else if(v==='commission') renderCommission();
  else if(v==='accounting') renderAccounting();
  else if(v==='admin') renderAdmin();
  else if(v==='portal') (me.role==='broker'?renderBrokerPortal:renderOfftakerPortal)();
}

/* ============================ PIPELINE BOARD (staff) ============================ */
async function renderBoard(){
  const m=$('main');
  m.innerHTML = `<div class="viewhead" style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px">
      <div><h2>Pipeline</h2><div class="sub">Data-licensing deals through the full lifecycle.</div></div>
      <div class="row" style="flex-wrap:nowrap">
        <input id="q" placeholder="Search name, company, email…" style="width:280px" onkeydown="if(event.key==='Enter')doSearch()" oninput="if(!this.value)renderBoard()" />
        <button class="btn" onclick="newLeadForm()">+ New lead</button></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="board" id="board"><div class="empty">Loading…</div></div>`;
  // accurate per-stage counts/sums (RLS-scoped, not capped) + a recent slice for cards
  const [{ data:sum, error:se }, { data:recent, error:re }] = await Promise.all([
    sb.rpc('board_summary'),
    sb.from('lead').select('id,company,contact_name,deal_value,current_stage,client:client_id(company_name)').eq('is_dead',false).order('created_at',{ascending:false}).limit(600)
  ]);
  if(se||re){ $('board').innerHTML=`<div class="empty">${esc((se||re).message)}</div>`; return; }
  const byStage = {}; (sum||[]).forEach(r=>byStage[r.stage]={cnt:Number(r.cnt),total:Number(r.total)});
  leads = recent||[];
  const openStages = stages.filter(s=>!s.is_lost && !s.is_won);
  const pipeVal = openStages.reduce((a,s)=>a+(byStage[s.key]?.total||0),0);
  const openCnt = openStages.reduce((a,s)=>a+(byStage[s.key]?.cnt||0),0);
  const weighted = openStages.reduce((a,s)=>a+(byStage[s.key]?.total||0)*Number(s.probability||0)/100,0);
  const wonC = byStage['final_payout_complete']||{cnt:0,total:0};
  $('kpis').innerHTML = kpi('Open pipeline',money(pipeVal),openCnt.toLocaleString()+' deals')
    + kpi('Weighted forecast',money(weighted),'by stage probability')
    + kpi('Closed',money(wonC.total),wonC.cnt+' completed');
  const CAP = 60;
  const cols = stages.filter(s=>!s.is_lost);
  $('board').innerHTML = cols.map(s=>{
    const info = byStage[s.key]||{cnt:0,total:0};
    const items = leads.filter(l=>l.current_stage===s.key);
    const shown = items.slice(0,CAP);
    const moreInStage = info.cnt - shown.length;
    return `<div class="col"><h3>${esc(s.label)}<span class="cnt">${info.cnt.toLocaleString()}${info.total?' · '+money(info.total):''}</span></h3>
      <div class="cards">${shown.map(cardHTML).join('')||'<div class="muted" style="padding:6px 4px;font-size:12px">—</div>'}
      ${moreInStage>0?`<div class="muted" style="padding:8px 4px;font-size:12px">+${moreInStage.toLocaleString()} more — use search above</div>`:''}</div></div>`;
  }).join('');
}
function kpi(l,n,s){ return `<div class="kpi"><div class="pl">${l}</div><div class="pn">${n}</div><div class="ps">${s}</div></div>`; }
async function doSearch(){
  const q=$('q').value.trim(); if(!q){ renderBoard(); return; }
  const b=$('board'); b.innerHTML='<div class="empty">Searching…</div>';
  const esc2=q.replace(/[%,]/g,' ');
  const { data, error } = await sb.from('lead')
    .select('id,company,contact_name,email,deal_value,current_stage,is_dead,client:client_id(company_name)')
    .or(`company.ilike.%${esc2}%,contact_name.ilike.%${esc2}%,email.ilike.%${esc2}%`)
    .order('created_at',{ascending:false}).limit(100);
  if(error){ b.innerHTML=`<div class="empty">${esc(error.message)}</div>`; return; }
  if(!data.length){ b.innerHTML=`<div class="empty"><div class="big">No matches</div>for "${esc(q)}"</div>`; return; }
  b.style.display='block';
  b.innerHTML = `<div class="panel" style="max-width:820px"><h3>${data.length} result${data.length!==1?'s':''} for "${esc(q)}"</h3>
    <table class="tbl"><thead><tr><th>Company</th><th>Contact</th><th>Stage</th><th style="text-align:right">Value</th></tr></thead><tbody>`
    + data.map(l=>`<tr style="cursor:pointer" onclick="openLead('${l.id}')"><td><b>${esc(l.company||l.client?.company_name||'—')}</b></td>
      <td>${esc(l.contact_name||'—')}<div class="muted" style="font-size:11.5px">${esc(l.email||'')}</div></td>

async function openLead(id){
  const { data:l } = await sb.from('lead').select('*, client:client_id(company_name,contact_name,contact_email)').eq('id',id).single();
  curLead=l;
  $('dTitle').textContent = l.company||l.client?.company_name||'Deal';
  const st=stages.find(s=>s.key===l.current_stage);
  $('dSub').textContent = (st?.label||l.current_stage) + (l.deal_value?' · '+money(l.deal_value):'');
  openDrawer();
  $('dBody').innerHTML='<div class="muted">Loading…</div>';
  const [{data:events},{data:sevents},{data:contracts},{data:quotes},{data:est},{data:dp},{data:grants},{data:offtakers}] = await Promise.all([
    sb.from('lead_event').select('*').eq('lead_id',id).order('created_at',{ascending:false}),
    sb.from('lead_stage_event').select('*').eq('lead_id',id).order('created_at',{ascending:false}),
    sb.from('contract').select('*').eq('lead_id',id).order('created_at',{ascending:false}),
    sb.from('quote').select('*').eq('lead_id',id).order('created_at',{ascending:false}),
    sb.rpc('estimate_commission',{p_lead:id}),
    sb.from('data_package').select('*').eq('lead_id',id).order('created_at',{ascending:false}),
    sb.from('data_package_access').select('*').order('granted_at',{ascending:false}),
    sb.from('external_portal_user').select('id,full_name,email,nda_signed_at,admin_approved_at').eq('kind','offtaker')
  ]);
  const feed = [...(events||[]).map(e=>({t:e.created_at,type:e.event_type,data:e.data})),
                ...(sevents||[]).map(e=>({t:e.created_at,type:'stage',data:{from:e.from_stage,to:e.to_stage,note:e.note}}))]
                .sort((a,b)=>new Date(b.t)-new Date(a.t));
  window._offtakers = offtakers||[];
  $('dBody').innerHTML = dealFields(l) + stepperHTML(l) + actionsHTML(l)
    + estHTML(est) + contractsHTML(contracts) + dpHTML(l,dp,grants,offtakers) + quotesHTML(l,quotes) + feedHTML(feed);
}
function dealFields(l){
  return `<div class="fld"><b>Client</b>${esc(l.company||l.client?.company_name||'—')}</div>
    <div class="fld"><b>Contact</b>${esc(l.contact_name||l.client?.contact_name||'—')} ${l.email?'· '+esc(l.email):''}</div>
    <div class="fld"><b>Deal value</b>${money(l.deal_value)} <span class="muted">gross</span></div>
    <div class="fld"><b>Engagement fee</b>${l.engagement_rate!=null?l.engagement_rate+'%':'—'}</div>
    <div class="fld"><b>Source</b>${esc(l.source)}</div>`;
}
function stepperHTML(l){
  const order = stages.filter(s=>!s.is_lost);
  const idx = order.findIndex(s=>s.key===l.current_stage);
  return `<div class="section-h">Stage</div><div class="stepper">` + order.map((s,i)=>{
    let cls = i<idx?'done': i===idx?'active':'';
    const isNext = i===idx+1 && me.internal;
    return `<span class="pill ${cls} ${isNext?'next':''}" ${isNext?`onclick="advance('${s.key}')"`:''}>${esc(s.label)}${isNext?' →':''}</span>`;
  }).join('') + `</div>`;
}
function actionsHTML(l){

}
function quotesHTML(l,qs){

  const rows=(qs||[]).map(q=>`<tr><td>${money(q.amount)}</td><td><span class="tag ${q.status==='accepted'?'green':''}">${esc(q.status)}</span></td>
    <td class="right-actions">${q.status==='submitted'?`<button class="btn sm" onclick="acceptQuote('${q.id}')">Accept</button>`:''}</td></tr>`).join('');
  return `<div class="section-h">Offtaker quotes</div><table class="tbl"><tbody>${rows||'<tr><td class="muted">No quotes yet</td></tr>'}</tbody></table>`;
}
function dpHTML(l, dp, grants, offtakers){
  if(!me.internal) return '';
  const pkg = (dp&&dp[0])||null;
  const oMap={}; (offtakers||[]).forEach(o=>oMap[o.id]=o.full_name||o.email);
  const eligible = (offtakers||[]).filter(o=>o.nda_signed_at&&o.admin_approved_at);
  let out = `<div class="section-h">Data package</div>`;
  if(!pkg){
    out += `<div class="row"><input id="dp_ptr" placeholder="Storage link / path to the export" style="width:280px" /><input id="dp_size" type="number" placeholder="bytes" style="width:110px" />
      <button class="btn sm" onclick="addPackage()">Add package</button></div>
      <div class="muted" style="font-size:12px;margin-top:6px">Points to where the anonymized export lives — not stored in the CRM.</div>`;
    return out;
  }
  const myGrants = (grants||[]).filter(g=>g.data_package_id===pkg.id && !g.revoked_at);
  out += `<div class="fld"><b>Package</b>v${pkg.version} · ${pkg.size_bytes?Math.round(pkg.size_bytes/1024)+' KB':'—'} · <span class="muted">${esc(pkg.storage_pointer)}</span></div>`;
  out += `<div style="margin:8px 0 4px;font-size:12px;color:var(--muted)">Shared with (offtakers can quote once shared):</div>`;
  out += myGrants.length? `<table class="tbl"><tbody>`+myGrants.map(g=>`<tr><td>${esc(oMap[g.offtaker_id]||'offtaker')}</td><td class="muted">${g.expires_at?'expires '+new Date(g.expires_at).toLocaleDateString():'no expiry'}</td><td class="right-actions"><button class="btn sm ghost" onclick="revokeAccess('${g.id}')">Revoke</button></td></tr>`).join('')+`</tbody></table>` : '<div class="muted" style="font-size:12.5px">Not shared yet.</div>';
  if(eligible.length){
    out += `<div class="row" style="margin-top:10px"><select id="dp_off">${eligible.filter(o=>!myGrants.some(g=>g.offtaker_id===o.id)).map(o=>`<option value="${o.id}">${esc(o.full_name||o.email)}</option>`).join('')}</select>
      <input id="dp_exp" type="number" placeholder="expires (days)" style="width:130px" />
      <button class="btn sm" onclick="sharePackage('${pkg.id}')">Share</button></div>`;
  } else {
    out += `<div class="muted" style="font-size:12px;margin-top:10px">No NDA-signed, approved offtakers yet. Invite/approve one in Admin → Data offtakers.</div>`;
  }
  return out;
}
async function addPackage(){
  const ptr=$('dp_ptr').value.trim(); if(!ptr){ toast('Add a storage link'); return; }
  const { error } = await sb.from('data_package').insert({ lead_id:curLead.id, storage_pointer:ptr, size_bytes:Number($('dp_size').value)||null });
  if(error){ toast(error.message); return; } toast('Package added'); openLead(curLead.id);
}
async function sharePackage(pkgId){
  const off=$('dp_off').value; if(!off){ toast('Pick an offtaker'); return; }
  const days=Number($('dp_exp').value)||null;
  const row={ data_package_id:pkgId, offtaker_id:off, granted_by:me.id };
  if(days) row.expires_at=new Date(Date.now()+days*86400000).toISOString();
  const { error } = await sb.from('data_package_access').insert(row);
  if(error){ toast(error.message); return; } toast('Shared'); openLead(curLead.id);
}
async function revokeAccess(id){

function feedHTML(feed){
  const ic={stage:'◆',assignment:'👤',doc_sent:'📄',quote_received:'💬',payment:'💵',accrual:'🧮',ar_opened:'🧾',deal_lost:'✖',clawback:'↩'};
  return `<div class="section-h">Activity</div><div class="feed">` + (feed.length? feed.map(e=>{
    let txt = e.type==='stage' ? `Moved ${e.data.from?stageLabel(e.data.from)+' → ':''}${stageLabel(e.data.to)}` : evText(e);
    return `<div class="ev"><span class="ic">${ic[e.type]||'•'}</span><span>${esc(txt)}</span><span class="tm">${when(e.t)}</span></div>`;
  }).join('') : '<div class="muted" style="padding:8px 0">No activity yet.</div>') + `</div>`;
}
function evText(e){ const d=e.data||{}; if(e.type==='accrual')return 'Commissions accrued on $'+Number(d.basis||0).toLocaleString(); if(e.type==='ar_opened')return 'AR ticket opened ('+money(d.amount)+')'; if(e.type==='deal_lost')return 'Marked lost: '+(d.reason||''); return e.type.replace(/_/g,' '); }
function stageLabel(k){ return stages.find(s=>s.key===k)?.label||k; }
function when(t){ const d=new Date(t),n=new Date(),diff=(n-d)/1000; if(diff<60)return'just now'; if(diff<3600)return Math.floor(diff/60)+'m'; if(diff<86400)return Math.floor(diff/3600)+'h'; return d.toLocaleDateString(); }

    <div class="panel"><h3>Users &amp; roles</h3><div id="usersTbl" class="muted">Loading…</div></div>
    <div class="panel" style="max-width:640px"><h3>Commission rate tables</h3>
      <div class="muted" style="font-size:12.5px;margin-bottom:12px">Default rates applied to everyone without an override. Spread model: manager pool rate minus rep rate = manager's spread. Editing inserts a new versioned rate; historical deals keep the rate that applied.</div>
      <div id="ratesBox" class="muted">Loading…</div></div>
    <div class="panel"><h3>Data offtakers &amp; brokers</h3>
      <div class="row" style="margin-bottom:8px"><button class="btn sm" onclick="genInvite('offtaker')">Invite a data offtaker →</button><button class="btn sm ghost" onclick="genInvite('broker')">Invite a broker →</button></div>
      <div id="inviteBox" style="margin-bottom:12px"></div>
      <div id="extTbl" class="muted">Loading…</div></div>`;
  const [{ data:users }, { data:rates }, { data:ext }] = await Promise.all([
    sb.from('app_user').select('*').order('role'),
    sb.from('commission_rate').select('*').is('subject_id',null).order('effective_date',{ascending:false}),
    sb.from('external_portal_user').select('*').order('created_at',{ascending:false})
  ]);
  $('extTbl').innerHTML = (ext&&ext.length)? `<table class="tbl"><thead><tr><th>Person</th><th>Type</th><th>NDA</th><th>Approved</th><th>Status</th></tr></thead><tbody>`
    + ext.map(u=>`<tr><td><b>${esc(u.full_name||'—')}</b><div class="muted" style="font-size:11.5px">${esc(u.email)}</div></td>
        <td>${esc(u.kind)}</td>
        <td>${u.kind==='offtaker'?(u.nda_signed_at?'<span class="tag green">signed</span>':`<button class="btn sm ghost" onclick="setGate('${u.id}',true,${!!u.admin_approved_at})">Mark signed</button>`):'—'}</td>
        <td>${u.kind==='offtaker'?(u.admin_approved_at?'<span class="tag green">approved</span>':`<button class="btn sm" onclick="setGate('${u.id}',${!!u.nda_signed_at},true)">Approve</button>`):'—'}</td>
        <td>${u.status==='active'?'<span class="tag green">active</span>':'<span class="tag gold">'+esc(u.status)+'</span>'}</td></tr>`).join('')
    + `</tbody></table>` : '<div class="empty">No offtakers or brokers yet. Invite one above.</div>';
  const mgrs = (users||[]).filter(u=>u.role==='sales_manager');
  $('usersTbl').innerHTML = `<table class="tbl"><thead><tr><th>Person</th><th>Role</th><th>Manager</th><th>Status</th></tr></thead><tbody>`
    + (users||[]).map(u=>{
      const roleSel = `<select onchange="setRole('${u.id}',this.value)">${ROLES.map(r=>`<option value="${r[0]}" ${u.role===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select>`;
      const mgrSel = u.role==='sales_rep'
        ? `<select onchange="setManager('${u.id}',this.value)"><option value="">— none —</option>${mgrs.map(mm=>`<option value="${mm.id}" ${u.manager_id===mm.id?'selected':''}>${esc(mm.full_name||mm.email)}</option>`).join('')}</select>`
        : '<span class="muted">—</span>';
      const isMe = u.id===me.id;
      return `<tr><td><b>${esc(u.full_name||'—')}</b>${isMe?' <span class="tag">you</span>':''}<div class="muted" style="font-size:11.5px">${esc(u.email)}</div></td>
        <td>${isMe?roleLabel(u.role):roleSel}</td><td>${mgrSel}</td>
        <td>${u.status==='active'?'<span class="tag green">active</span>':'<span class="tag">'+esc(u.status)+'</span>'}
        ${isMe?'':`<button class="btn sm ghost" style="margin-left:6px" onclick="toggleStatus('${u.id}','${u.status}')">${u.status==='active'?'Deactivate':'Activate'}</button>`}</td></tr>`;
    }).join('') + `</tbody></table>`;
  const latest={}; (rates||[]).forEach(r=>{ if(!latest[r.subject_type]) latest[r.subject_type]=r; });
  const rrow=(type,label,hasFloor)=>{ const r=latest[type]||{rate:0,floor:null};
    return `<div class="row" style="margin-bottom:10px"><b style="width:130px;display:inline-block">${label}</b>
      <input id="rate_${type}" type="number" step="0.5" value="${r.rate}" style="width:80px" /> %
      ${hasFloor?`<span class="muted" style="margin-left:10px">floor</span> <input id="floor_${type}" type="number" step="0.5" value="${r.floor??''}" style="width:80px" /> %`:''}
      <button class="btn sm" style="margin-left:8px" onclick="saveRate('${type}',${hasFloor})">Save</button></div>`; };
  $('ratesBox').innerHTML = rrow('rep','Sales Rep',false)+rrow('manager','Sales Manager',true)+rrow('broker','Broker',false);
}
async function setRole(id,role){ const patch={role}; if(role!=='sales_rep') patch.manager_id=null;
  const { error } = await sb.from('app_user').update(patch).eq('id',id); if(error){toast(error.message);return;} toast('Role updated'); renderAdmin(); }
async function setManager(id,mgr){ const { error } = await sb.from('app_user').update({manager_id:mgr||null}).eq('id',id); if(error){toast(error.message);return;} toast('Manager set'); }
async function toggleStatus(id,cur){ const s=cur==='active'?'inactive':'active'; const { error } = await sb.from('app_user').update({status:s}).eq('id',id); if(error){toast(error.message);return;} toast('Status updated'); renderAdmin(); }
async function saveRate(type,hasFloor){ const rate=Number($('rate_'+type).value); const floor=hasFloor?(($('floor_'+type).value)===''?null:Number($('floor_'+type).value)):null;
  const { error } = await sb.from('commission_rate').insert({ subject_type:type, subject_id:null, rate, floor, created_by:me.id }); if(error){toast(error.message);return;} toast(roleLabel(type)+' rate saved'); }
async function genInvite(kind){
  const { data, error } = await sb.rpc('create_invite',{ p_external_kind:kind });
  if(error){ toast(error.message); return; }
  const link = location.origin+location.pathname+'?invite='+data;
  $('inviteBox').innerHTML = `<div class="muted" style="font-size:12px;margin-bottom:5px">${kind==='offtaker'?'Data offtaker':'Broker'} invite — valid 30 days. They sign up, then ${kind==='offtaker'?'sign the NDA and you approve them below':'pass the product test'} before access.</div>
    <div class="row"><input id="invLink" value="${esc(link)}" readonly style="flex:1;min-width:260px" /><button class="btn sm" onclick="copyText(document.getElementById('invLink').value)">Copy link</button></div>`;
  toast('Invite link ready');
}
async function setGate(offId,nda,approve){
  const { error } = await sb.rpc('set_offtaker_gate',{ p_offtaker:offId, p_nda:nda, p_approve:approve });
  if(error){ toast(error.message); return; } toast('Updated'); renderAdmin();
}
/* ============================ BROKER PORTAL ============================ */
async function renderBrokerPortal(){
  const m=$('main');
  m.innerHTML = `<div class="viewhead"><h2>Broker portal</h2><div class="sub">Submit deals and track your commission. Deal status only — no client-side terms.</div></div>
    <div class="kpis" id="bkKpis"></div>
    <div class="panel" style="max-width:620px"><h3>Submit a deal</h3>
      <div class="row"><input id="bl_company" placeholder="Company *" style="width:220px" /><input id="bl_contact" placeholder="Contact name" style="width:180px" /></div>
      <div class="row" style="margin-top:8px"><input id="bl_email" placeholder="Email" style="width:220px" /><input id="bl_phone" placeholder="Phone" style="width:150px" />
        <button class="btn" onclick="submitBrokerLead()">Submit</button></div></div>
    <div class="panel"><h3>My submitted deals</h3><div id="bkLeads" class="muted">Loading…</div></div>
    <div class="panel"><h3>My commission</h3><div id="bkComm" class="muted">Loading…</div></div>`;
  const [{data:leads},{data:comm}] = await Promise.all([
    sb.from('broker_lead_view').select('*').order('created_at',{ascending:false}),
    sb.from('broker_commission_view').select('*').order('created_at',{ascending:false})
  ]);
  const earned = (comm||[]).reduce((s,e)=>s+Number(e.computed_amount),0);
  const paid = (comm||[]).filter(e=>e.status==='paid').reduce((s,e)=>s+Number(e.computed_amount),0);
  $('bkKpis').innerHTML = kpi('Deals submitted',(leads||[]).length,'')+kpi('Commission earned',money(earned),'across all deals')+kpi('Paid out',money(paid),'settled');
  $('bkLeads').innerHTML = (leads&&leads.length)? `<table class="tbl"><thead><tr><th>Company</th><th>Status</th><th>Submitted</th></tr></thead><tbody>`
    + leads.map(l=>`<tr><td><b>${esc(l.company||'—')}</b></td><td>${l.is_dead?'<span class="tag red">Lost</span>':esc(l.status_label||l.status)}</td><td class="muted">${new Date(l.created_at).toLocaleDateString()}</td></tr>`).join('')+`</tbody></table>`
    : '<div class="empty">No deals submitted yet.</div>';
  $('bkComm').innerHTML = (comm&&comm.length)? `<table class="tbl"><thead><tr><th>Rate</th><th style="text-align:right">Amount</th><th>Status</th></tr></thead><tbody>`
    + comm.map(e=>`<tr><td>${e.rate_applied}%</td><td style="text-align:right">${money(e.computed_amount)}</td><td>${stTag(e.status)}</td></tr>`).join('')+`</tbody></table>`
    : '<div class="empty">No commission yet — you earn when your deals are paid.</div>';
}
async function submitBrokerLead(){
  const company=$('bl_company').value.trim(); if(!company){ toast('Company required'); return; }
  const { error } = await sb.rpc('submit_broker_lead',{ p_company:company, p_contact:$('bl_contact').value.trim()||null, p_email:$('bl_email').value.trim()||null, p_phone:$('bl_phone').value.trim()||null });
  if(error){ toast(error.message); return; }
  toast('Deal submitted'); renderBrokerPortal();
}

/* ============================ OFFTAKER PORTAL ============================ */
async function renderOfftakerPortal(){
  const m=$('main');
  const pending = !me.nda_signed_at || !me.admin_approved_at;
  m.innerHTML = `<div class="viewhead"><h2>Offtaker portal</h2><div class="sub">Deals shared with you. Quotes are private — you never see others' bids.</div></div>
    ${pending?`<div class="panel" style="border-color:var(--gold);background:rgba(201,162,39,.06)"><b>Access pending.</b> <span class="muted">You'll see shared deals once your NDA is signed and your account is approved.</span></div>`:''}
    <div class="panel"><h3>Deals shared with you</h3><div id="ofDeals" class="muted">Loading…</div></div>
    <div class="panel"><h3>My quotes</h3><div id="ofQuotes" class="muted">Loading…</div></div>`;
  const [{data:deals},{data:quotes}] = await Promise.all([
    sb.from('offtaker_deal_view').select('*'),
    sb.from('offtaker_quote_view').select('*').order('created_at',{ascending:false})
  ]);
  window._ofDeals = deals||[];
  $('ofDeals').innerHTML = (deals&&deals.length)? `<table class="tbl"><thead><tr><th>Industry</th><th>Size</th><th>Region</th><th>Package</th><th></th></tr></thead><tbody>`
    + deals.map((d,i)=>`<tr><td>${esc(d.industry||'—')}</td><td>${esc(d.company_size||'—')}</td><td>${esc(d.region||'—')}</td>
        <td class="muted">v${d.package_version} · ${d.size_bytes?Math.round(d.size_bytes/1024)+' KB':'—'}</td>
        <td class="right-actions"><button class="btn sm" onclick="quoteForm(${i})">Submit quote</button></td></tr>`).join('')+`</tbody></table>`
    : '<div class="empty">No deals shared with you yet.</div>';
  $('ofQuotes').innerHTML = (quotes&&quotes.length)? `<table class="tbl"><thead><tr><th style="text-align:right">Amount</th><th>Terms</th><th>Status</th><th>Submitted</th></tr></thead><tbody>`
    + quotes.map(q=>`<tr><td style="text-align:right">${money(q.amount)}</td><td>${esc(q.terms||'—')}</td><td>${stTag(q.status)}</td><td class="muted">${new Date(q.created_at).toLocaleDateString()}</td></tr>`).join('')+`</tbody></table>`
    : '<div class="empty">No quotes submitted yet.</div>';
}
function quoteForm(i){
  const d=window._ofDeals[i];
  $('dTitle').textContent='Submit a quote'; $('dSub').textContent=`${d.industry||'Deal'} · ${d.region||''}`;
  $('dBody').innerHTML = `<div class="fld"><b>Amount $</b><input id="q_amt" type="number" step="1000" style="width:180px" /></div>
    <div class="fld" style="align-items:flex-start"><b>Terms / notes</b><textarea id="q_terms" placeholder="Payment terms, conditions…"></textarea></div>
    <button class="btn" style="margin-top:8px" onclick="submitQuote2('${d.id}')">Submit quote</button>
    <div class="muted" style="font-size:12px;margin-top:10px">Your quote is private to Polyshares — competing offtakers never see it.</div>`;
  openDrawer();
}
async function submitQuote2(leadId){
  const amount=Number($('q_amt').value); if(!(amount>0)){ toast('Enter an amount'); return; }
  const { error } = await sb.from('quote').insert({ lead_id:leadId, offtaker_id:me.id, amount, terms:$('q_terms').value||null });
  if(error){ toast(error.message); return; }
  closeDrawer(); toast('Quote submitted'); renderOfftakerPortal();
}

/* ============================ cert gate ============================ */
let quizQ=[], quizA={};
async function showGate(){
  $('app').style.display='none'; $('gate').style.display='block';
  const { data:mod } = await sb.from('training_module').select('*').eq('active',true).order('version',{ascending:false}).limit(1).maybeSingle();
  if(!mod){ $('gateBody').innerHTML='<div class="empty">No active module. Contact an admin.</div>'; return; }
  const { data:qs } = await sb.rpc('get_quiz',{ p_module:mod.id });
  quizQ = qs||[]; window._mod=mod;
  $('gateBody').innerHTML = quizQ.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.question)}</b>
    ${(q.options||[]).map((o,oi)=>`<label class="opt" onclick="pick('${q.id}',${oi},this)">${esc(o)}</label>`).join('')}</div>`).join('')
    + `<button class="btn" onclick="submitQuiz()">Submit test</button> <span id="quizmsg" class="muted"></span>`;
}
function pick(qid,oi,el){ quizA[qid]=oi; el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); el.classList.add('sel'); }
async function submitQuiz(){
  if(Object.keys(quizA).length<quizQ.length){ $('quizmsg').textContent='Answer every question.'; return; }
  const { data, error } = await sb.rpc('submit_quiz',{ p_module:window._mod.id, p_answers:quizA });
  if(error){ $('quizmsg').textContent=error.message; return; }
  const r=data[0];
  if(r.passed){ toast('Passed — '+r.score+'%'); $('gate').style.display='none'; boot(); }
  else { $('quizmsg').textContent=`Scored ${r.score}% — need ${r.threshold}%. Try again.`; quizA={}; document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); }
}

/* ============================ drawer helpers + init ============================ */
function openDrawer(){ $('drawer').classList.add('open'); $('drawerback').style.display='block'; }
function closeDrawer(){ $('drawer').classList.remove('open'); $('drawerback').style.display='none'; const on=document.querySelector('#nav button.on'); if(on&&on.dataset.v==='board') renderBoard(); }

// invite link → switch the login card to signup mode
const _invite = new URLSearchParams(location.search).get('invite');
if(_invite){
  localStorage.setItem('pendingInvite', _invite);
  document.querySelector('#login h1').textContent='Create your account';
  document.querySelector('#login .sub').textContent="You've been invited to the Polyshares deal platform.";
  const b=$('lg_btn'); b.textContent='Create account'; b.setAttribute('onclick','doSignup()');
  $('lg_pass').setAttribute('autocomplete','new-password');
}
boot();
</script>
