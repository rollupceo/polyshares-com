gainst the monthly detail and the service-line COGS build.`,`The largest driver is mix: hardware and licensing resale grew to ${ce(te.FY24.lines.find(e=>e.id==="hardware").revenue)} — ${et(te.FY24.lines.find(e=>e.id==="hardware").revenue/te.FY24.revenue)} of revenue — at an ${et(te.FY24.lines.find(e=>e.id==="hardware").gmPct)} margin. Pass-through dollars flatter the top line and dilute the percentage.`,`Second is labour. A 9.5% engineering wage adjustment landed in July 2024 and was not passed to clients until the January 2025 price increase, so FY24 absorbed six months of cost with no price. Managed-services margin fell ${et(te.FY23.lines[0].gmPct)} → ${et(te.FY24.lines[0].gmPct)}.`,`FY25 recovered to ${et(te.FY25.gmPct)}, but that recovery is one year old and rests on a price increase with no churn evidence behind it yet. That is a diligence question for the seller, not a settled fact — it is finding #12.`],cites:["Monthly P&L Detail FY23-FY25.xlsx — 36 periods","FY23-FY25 Annual P&L (Consolidated).xlsx","Payroll Register FY25.xlsx"],chart:"gmAttr",chartData:OX},{id:"relparty",chip:"Show me every dollar of related-party spend.",keywords:["related party","related-party","family","owner","seller spend","keller","personal"],headline:`${ce(bA)} of FY25 spend runs through the seller or entities and people connected to him. ${ce(jX)} of it is above market or has no business purpose.`,paras:["Seven streams. I found them by joining the payroll register to the org chart and the ticketing user list, the AP ledger to the operating agreement's related-party schedule, and the OCR'd card statements back to the GL.",`The rent is the structurally important one. Cascade pays ${ce(te.FY25.opexDetail.rent)} a year to Cascade Holdings LLC, which R. Keller owns outright — $18.00/sq ft NNN against a $12.00 Tacoma flex comp set. The lease expires in 2027 with no renewal option, so unless a new arm's-length lease is signed before closing, the buyer negotiates from inside the building.`,`One item nets to zero: Keller Digital LLC invoiced ${ce(42e3)} of "IT consulting." The hours are real and the work would otherwise be bought outside, so it is a genuine cost — but it is a related-party contract that must be terminated or papered at close.`,`${ce(899e3)} of this flows into the QoE bridge as addbacks. The ${ce(132e3)} rent excess is in there too, at Medium confidence pending a broker opinion.`],cites:["Payroll Register FY25.xlsx","Cap Table & Operating Agreement.pdf p. 22","Real Property Lease - 4200 Marine View Dr.pdf","Bank Statements FY25 (12 mo).pdf — OCR","AP Aging Detail 12.31.25.xlsx"],chart:"relParty"},{id:"top3",chip:"What happens to IRR if we lose the top 3 clients?",keywords:["top 3","top three","lose","irr","concentration","churn","stress"],headline:`IRR goes from ${et(dr.irr)} to ${pr.irr===null?"negative":et(pr.irr)} and the credit breaks in year one. Minimum DSCR falls to ${pr.minDscr.toFixed(2)}x.`,paras:[`The top three — Sound Health Partners, Evergreen School District 114, Northwest Timber Holdings — are ${ce(bo.slice(0,3).reduce((e,t)=>e+t.revenue,0))}, or ${et(zi)} of revenue.`,`I re-ran the live model with that revenue removed permanently from year one at a 38% contribution margin, which is the right number here: the service desk and the NOC do not shrink 24% because three logos leave. Year-one EBITDA falls from ${ce(dr.years[0].ebitda)} to ${ce(pr.years[0].ebitda)}.`,`Senior leverage on entry is ${dr.entryLeverage.toFixed(2)}x. Under the stress it is ${pr.years[0].seniorLeverage.toFixed(2)}x by the end of year one, against a covenant that would typically be set at 3.75x with a step-down. Minimum DSCR of ${pr.minDscr.toFixed(2)}x is below 1.0x — the company cannot service the debt out of cash flow.`,"This is not a tail scenario. The largest of the three has been month-to-month since March 2024, and the second is a school district with a mandatory re-bid. That is why finding #1 is Critical and why the structure should carry a larger seller note or an earnout tied to the Sound Health renewal."],cites:["Customer Revenue Detail by Month FY23-FY25.xlsx","Top 20 Client Contracts (executed).pdf","Live LBO model — stress run"],chart:"stress",chartData:[{label:"Base case",irr:dr.irr,moic:dr.moic,dscr:dr.minDscr},{label:"Lose top 3",irr:Math.max(0,(vw=pr.irr)!=null?vw:0),moic:(yw=pr.moic)!=null?yw:0,dscr:pr.minDscr}]},{id:"recurring",chip:"Is the recurring revenue actually recurring?",keywords:["recurring","contracted","month-to-month","mtm","arr","mrr","sticky","contract"],headline:`${et(te.FY25.recurringPct)} of revenue is recurring in character. Only ${et(1-na)} of it is actually under contract — ${ce(Wt[0].amount)} is month-to-month.`,paras:[`Two different questions get answered with the same number in the CIM. Recurring by revenue type: ${ce(te.FY25.recurring)} of managed services, cloud, security and voice, versus ${ce(te.FY25.nonRecurring)} of projects and hardware. That part checks out and it has improved — ${et(te.FY23.recurringPct)} in FY23 to ${et(te.FY25.recurringPct)} in FY25.`,`Recurring by contract is a different story. ${ce(Wt[0].amount)} — ${et(na)} of the recurring base — sits on expired or month-to-month terms, and that includes the single largest client at ${et($l)} of total revenue. Another ${ce(Wt[1].amount)} expires within twelve months.`,"The MSA template itself carries a 90-day termination-for-convenience right, so even the contracted revenue is a 90-day promise rather than a 36-month one.",`The retention data is genuinely good and I would not undersell it: NRR ${et(jd)}, GRR ${et(Pd)}, and the pre-2020 cohort still grew. Cascade keeps clients. But "we keep them" and "they are contracted" are not the same underwriting fact, and the price should reflect which one you are buying.`],cites:["Top 20 Client Contracts (executed).pdf — 20 executed MSAs","MSA Template & Service Schedules.docx","Customer Revenue Detail by Month FY23-FY25.xlsx"],chart:"ladder"},{id:"inflate",chip:"Where is the seller most likely inflating EBITDA?",keywords:["inflat","overstat","aggressive","seller","ebitda gap","quality","addback"],headline:`The CIM's ${ce(fe.bankerAdjEbitda)} is ${ce(Sn)} too high. At the 8.0x ask that is ${we(Sn*fe.askMultiple)} of purchase price.`,paras:["The inflation is not in the addbacks the CIM shows — most of those are legitimate and I accepted them. It is in what the CIM leaves out. Five run-rate costs are missing entirely.",`Largest: ${ce(178e3)} of gross profit from ${ce(135e4)} of one-time hardware refresh work for Evergreen SD 114 and Sound Health. Both are documented multi-year replacement cycles in the client contracts. Presenting that as run-rate is the single most aggressive item in the book.`,`Then ${ce(64e3)} of unfunded 401(k) safe-harbor match that is mandatory under the plan document and was never expensed, accrued, or deposited; ${ce(52e3)} of contracted RMM/PSA price increase already executed for 1/1/2026; ${ce(85e3)} for the controller the business does not have; and ${ce(38e3)} of normalised bad debt against a >90 bucket that grew to ${ce(31e4)} with no allowance.`,`I also haircut the owner-comp addback by ${ce(6e4)} — the CIM normalises to a $325K CEO; the Service Leadership and ConnectWise comp studies put an ${we(te.FY25.revenue)} MSP at ${ce(385e3)}.`,`Two of the seller's seven addbacks I rejected outright: "one-time recruiting" appears in all three years, and "IT consulting" traces to the seller's own entity.`],cites:["CIM - Project Cascade.pdf p. 18","401(k) Census & Plan Docs FY25.pdf pp. 3–7","Customer Revenue Detail by Month FY23-FY25.xlsx","AR Aging Detail 12.31.25.xlsx"],chart:"gap"},{id:"tax",chip:"What did the tax returns say that the P&L didn't?",keywords:["tax","return","1120s","m-1","nexus","idaho","book-to-tax","state"],headline:`Three things. An unfiled state, a ${ce(ug)} book-to-tax difference that reconciles cleanly, and an S-corp history that makes an F-reorg worth roughly ${we(dr.stepUpAmortAnnual*wo.taxRate*8.5)} of after-tax value over the hold.`,paras:[`The gap that matters is an absence. There is no Idaho return in the data room in any year, but the payroll register puts three employees at Idaho addresses since 2022 and Basin Ag Cooperative revenue is Idaho-sourced. Payroll creates nexus. Because nothing was ever filed, the statute of limitations has never started running, so the exposure is open-ended rather than capped at three years. I estimate ${ce(118e3)}.`,`Oregon CAT returns were filed late for FY23 and FY24 and understate OR-sourced activity of roughly $2.9M — ${ce(46e3)}. Washington B&O has managed-services revenue reported under Retailing at 0.471% instead of Service & Other Activities at 1.75% — ${ce(92e3)}. Total quantified exposure ${ce(Nr)}.`,`The M-1 itself is clean and I want to be fair about that: ${ce(268e3)} of §179 and bonus depreciation over book, ${ce(31e3)} of meals disallowance, ${ce(41e3)} of accrued bonus caught by §461(h). It ties. Nothing is hiding in the reconciliation.`,`One thing the returns confirm that helps you: valid S-corp election since 2009, single member. An F-reorganisation lets the seller roll ${et(wo.rolloverPct)} tax-deferred while you take a stepped-up basis of ${ce(dr.stepUpBasis)} on the purchased portion, amortised over 15 years — ${ce(dr.years[0].stepUpShield)} a year of cash tax shield. That is switched on in the LBO tab and you can toggle it off to see what it is worth.`],cites:["Federal Return 1120S FY23/FY24/FY25.pdf — Schedule M-1","State Returns WA-OR-ID FY23-FY25.pdf — no ID filings found","Payroll Register FY25.xlsx"],chart:"nexus"}];function PX(e){const t=e.toLowerCase().trim();if(!t)return null;let n=null,r=0;for(const i of av){let a=0;for(const l of i.keywords)t.includes(l)&&(a+=3+l.length/10);const o=i.chip.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(l=>l.length>3),s=new Set(t.replace(/[^a-z0-9 ]/g," ").split(/\s+/));for(const l of o)s.has(l)&&(a+=1);a>r&&(r=a,n=i)}return{item:n||
