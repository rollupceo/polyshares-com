    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

    // its (possibly foreign) parent.

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

at('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4c9df45d-f3d4-4065-89a1-4439917d5c1e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin:0; background:#071120; font-family:'Instrument Sans',Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }\n  a { color:#9CC4F0; text-decoration:none; }\n  a:hover { color:#C4BAFF; }\n  @keyframes beam { 0%,100% { opacity:.25; transform:rotate(16deg) translateY(-3%); } 50% { opacity:.9; transform:rotate(16deg) translateY(3%); } }\n  @keyframes floatSlow { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }\n\n/* === POLYSHARES MOBILE SYSTEM === */\n  /* ===================================================================\n     MOBILE SYSTEM  (shared across every page — edit src/_mobile.css and\n     run `python3 tools/mobile-css.py` to push it into all five templates)\n     =================================================================== */\n\n  /* the menu button exists only below the desktop breakpoint */\n  [data-navmenu] { display:none; }\n\n  @media (max-width: 900px) {\n\n    /* --- foundation ------------------------------------------------- */\n    html { -webkit-text-size-adjust:100%; text-size-adjust:100%; overflow-x:clip; }\n    body { overflow-x:clip; }\n    a, [sc-camel-on-click], [onclick] { -webkit-tap-highlight-color:rgba(107,165,247,.16); }\n    a:focus-visible, [tabindex]:focus-visible { outline:2px solid #6BA5F7; outline-offset:3px; border-radius:8px; }\n    img { max-width:100%; }\n\n    /* the page shell clips its own children on desktop; on mobile that\n       would kill the sticky header, so clipping moves up to <html> */\n    [data-root] { overflow:visible !important; }\n\n    /* a wrapper between the shell and the header would become the sticky\n       containing block and unstick it at the end of the hero */\n    [data-passthrough] { display:contents; }\n\n    /* --- gutters and vertical rhythm --------------------------------- */\n    [data-pad] { padding-left:20px !important; padding-right:20px !important; }\n    [data-sectionpad] { padding-top:64px !important; padding-bottom:64px !important; }\n    [data-heropad] { padding-top:44px !important; padding-bottom:64px !important; }\n\n    /* --- type scale --------------------------------------------------- */\n    [data-h1] {\n      font-size:clamp(32px, 8.8vw, 46px) !important; line-height:1.05 !important;\n      letter-spacing:-.035em !important; max-width:none !important; text-wrap:balance;\n    }\n    [data-h2] {\n      font-size:clamp(26px, 6.9vw, 34px) !important; line-height:1.1 !important;\n      letter-spacing:-.03em !important; max-width:none !important; text-wrap:balance;\n    }\n    [data-lead] { font-size:17px !important; line-height:1.6 !important; max-width:none !important; }\n    [data-h1] > span { display:block; }\n    [data-statement] {\n      font-size:clamp(26px, 7.1vw, 34px) !important; line-height:1.18 !important;\n      letter-spacing:-.03em !important; max-width:none !important;\n    }\n\n    /* --- sticky header ------------------------------------------------ */\n    [data-topbar] {\n      position:sticky; top:0; z-index:60;\n      background:rgba(7,17,32,.86);\n      -webkit-backdrop-filter:saturate(170%) blur(14px);\n      backdrop-filter:saturate(170%) blur(14px);\n      border-bottom:1px solid rgba(255,255,255,.08) !important;\n    }\n    [data-topbar] [data-pad] > div { height:56px !important; border-bottom:none !important; }\n    [data-topbar] a[href*=\"calendly\"] {\n      padding:0 14px !important; height:42px; box-sizing:border-box;\n      display:inline-flex; align-items:center;\n      font-size:13.5px !important; border-radius:11px !important; white-space:nowrap;\n    }\n    [data-topbar] [data-pad] > div > div:first-child { gap:0 !important; }\n    [data-navlinks], [data-navalt] { display:none !important; }\n    [data-navactions] { gap:10px !important; }\n    [data-topbar] [data-pad] > div > div:first-child > a { min-height:44px; align-items:center; }\n\n    /* small pill controls need a thumb-sized hit area */\n    [data-pillbtn] {\n      box-sizing:border-box; min-height:44px;\n      display:inline-flex !important; align-items:center; justify-content:center;\n    }\n\n    /* the old scrolling link strip is replaced by the menu below */\n    [data-mobilenav] { display:none !important; }\n\n    /* menu button + dropdown (a <details>, so it works without JS) */\n    [data-navmenu] { display:block; }\n    [data-navmenu] > summary {\n      list-style:none; box-sizing:border-box; cursor:pointer;\n      width:42px; height:42px; display:flex; flex-direction:column;\n      align-items:center; justify-content:center; gap:4px;\n      border:1px solid rgba(255,255,255,.16); border-radius:11px;\n      background:rgba(255,255,255,.04);\n    }\n    [data-navmenu] > summary::-webkit-details-marker { display:none; }\n    [data-navmenu] > summary::marker { content:\"\"; }\n    [data-navmenu] > summary > span {\n      display:block; width:16px; height:1.5px; border-radius:2px; background:#F4F4F6;\n      transition:transform .18s ease, opacity .18s ease;\n    }\n    [data-navmenu][open] > summary { background:rgba(46,123,234,.16); border-color:rgba(107,165,247,.45); }\n    [data-navmenu][open] > summary::after {\n      content:\"\"; position:absolute; z-index:55; cursor:default;\n      top:100%; left:-100vw; right:-100vw; height:200vh;\n      background:rgba(4,9,18,.72);\n    }\n    [data-navmenu][open] > summary > span:first-child { transform:translateY(5.5px) rotate(45deg); }\n    [data-navmenu][open] > summary > span:nth-child(2) { opacity:0; }\n    [data-navmenu][open] > summary > span:last-child { transform:translateY(-5.5px) rotate(-45deg); }\n\n    /* opaque, not translucent — page copy showing through the menu was the\n       single ugliest thing on the site */\n    [data-navpanel] {\n      position:absolute; left:0; right:0; top:100%; z-index:62;\n      display:flex; flex-direction:column;\n      padding:6px 20px 18px;\n      background:#080F1D;\n      border-bottom:1px solid rgba(255,255,255,.1);\n      box-shadow:0 30px 40px -18px rgba(0,0,0,.9);\n    }\n    [data-navpanel] > a {\n      display:flex; align-items:center; min-height:54px;\n      font-size:17px; font-weight:500; letter-spacing:-.015em;\n      color:rgba(244,244,246,.82) !important;\n      border-bottom:1px solid rgba(255,255,255,.07);\n    }\n    [data-navpanel] > a[data-current] { color:#9CC4F0 !important; }\n    [data-navpanel] > a[data-navcta] {\n      justify-content:center; margin-top:16px; min-height:52px;\n      background:#2A72DC; color:#fff !important; border-radius:11px;\n      border-bottom:none; font-size:17px; font-weight:600;\n    }\n\n    /* --- grids -------------------------------------------------------- */\n    [data-cols], [data-rail], [data-caserow], [data-timeline] { grid-template-columns:1fr !important; }\n    [data-cols] { gap:20px !important; }\n    [data-cols] > *, [data-caserow] > * { border-right:none !important; }\n\n    /* seamless (gapless) grids keep their hairlines, but horizontal ones */\n    [data-splitgrid] { gap:0 !important; }\n    [data-splitgrid] > * { border-right:none !important; border-bottom:none !important; }\n    [data-splitgrid] > * + * { border-top:1px solid rgba(255,255,255,.08) !important; }\n    [data-caserow] > * + * { border-top:1px solid rgba(255,255,255,.08) !important; }\n\n    /* --- stat rails: 2x2 card, not four tall rows --------------------- */\n    [data-proof], [data-stats] {\n      display:grid !important; grid-template-columns:1fr 1fr !important;\n      width:100% !important; gap:0 !important;\n      border:1px solid rgba(255,255,255,.12) !important; border-radius:14px !important;\n      overflow:hidden !important;\n    }\n    [data-proof] { margin-top:34px !important; }\n    [data-proof] > div, [data-stats] > div {\n      padding:16px 16px 18px !important; text-align:left !important;\n      border-right:1px solid rgba(255,255,255,.09) !important;\n      border-bottom:1px solid rgba(255,255,255,.09) !important;\n    }\n    [data-proof] > div:nth-child(2n), [data-stats] > div:nth-child(2n) { border-right:none !important; }\n    [data-proof] > div:nth-last-child(-n+2), [data-stats] > div:nth-last-child(-n+2) { border-bottom:none !important; }\n    [data-proof] > div > div:first-child { font-size:23px !important; }\n    [data-stats] > div > div:first-child { font-size:30px !important; }\n    [data-stats] > div > div:last-child { font-size:13px !important; margin-top:8px !important; }\n\n    /* --- the four-week rail (home) ------------------------------------ */\n    [data-rail] { border-top:none !important; }\n    [data-rail] > div {\n      padding:24px 0 26px !important;\n      border-top:1px solid rgba(255,255,255,.12) !important;\n    }\n    [data-rail] > div:last-child { padding-bottom:0 !important; }\n    [data-rail] > div > div { max-width:none !important; }\n    [data-rail] > div > div:first-of-type { font-size:36px !important; }\n\n    /* --- CTA rows: stacked, thumb-sized ------------------------------- */\n    [data-stack] { flex-direction:column !important; align-items:stretch !important; }\n    [data-stack] > a, [data-stack] > span[style*=\"border\"] {\n      text-align:center !important; box-sizing:border-box; min-height:50px;\n      display:flex !important; align-items:center; justify-content:center;\n      border-radius:11px !important;\n    }\n    [data-cta-row] { flex-direction:column !important; width:100% !important; align-self:stretch !important; gap:10px !important; }\n    [data-cta-row] > a, [data-cta-row] > span {\n      display:block !important; text-align:center !important;\n      padding:15px 20px !important; font-size:15.5px !important; border-radius:11px !important;\n    }\n\n    /* --- footer -------------------------------------------------------- */\n    [data-footer] {\n      flex-direction:column !important; align-items:flex-start !important;\n      gap:10px !important; margin-top:64px !important;\n    }\n    [data-footer] > div { flex-wrap:wrap !important; gap:0 20px !important; }\n    [data-footer] a, [data-footer] > span { min-height:44px; display:inline-flex; align-items:center; }\n\n    /* --- people cards -------------------------------------------------\n       A portrait beside the bio squeezes the text to ~20 characters a\n       line. Portrait and name share the top row; the bio runs full width\n       underneath, where it reads properly. */\n    [data-person] {\n      display:grid !important;\n      grid-template-columns:auto minmax(0,1fr);\n      grid-template-areas:\"photo name\" \"bio bio\";\n      column-gap:14px !important; row-gap:12px !important;\n      align-items:center !important; padding:18px !important;\n    }\n    [data-person] > img {\n      grid-area:photo; width:60px !important; height:72px !important; border-radius:9px !important;\n    }\n    [data-person] > div { display:contents; }\n    [data-person] > div > div:first-child { grid-area:name; font-size:19px !important; }\n    [data-person] > div > div:last-child {\n      grid-area:bio; margin-top:0 !important; font-size:15px !important; line-height:1.6 !important;\n    }\n    [data-chips] { padding:14px 18px !important; gap:6px !important; }\n\n    /* --- services: leak picker + engagement accordion ------------------- */\n    [data-leakpane] { padding:24px 20px !important; min-height:0 !important; }\n    [data-buildrow] { gap:20px !important; }\n    [data-hours] { text-align:left !important; }\n    [data-hours] > div:nth-child(2) { font-size:38px !important; }\n    [data-hours] > div:last-child { max-width:none !important; }\n    [data-engagementrow] { gap:14px !important; padding:22px 20px !important; }\n    [data-engagementmeta] { text-align:left !important; display:flex; gap:12px; align-items:baseline; }\n    [data-accordionbody] { padding:0 20px 24px !important; }\n\n    /* label above figure — side by side, both wrap into a mess */\n    [data-kv] {\n      flex-direction:column !important; align-items:flex-start !important;\n      gap:2px !important; margin-top:12px !important;\n    }\n\n    /* --- case studies: platform-size switcher --------------------------- */\n    [data-sizebar] { padding:18px 20px !important; }\n    [data-sizepills] { width:100%; gap:8px !important; }\n    [data-sizepills] > span {\n      flex:1 1 0; text-align:center; box-sizing:border-box; min-height:44px;\n      display:inline-flex !important; align-items:center; justify-content:center;\n      font-size:13px !important; padding:0 6px !important; white-space:nowrap;\n    }\n    [data-metriccards] > div { padding:22px !important; }\n    [data-metriccards] > div > div:first-child { font-size:32px !important; letter-spacing:-.02em !important; }\n\n    /* --- card headers: title over label, never squeezed side by side ---- */\n    [data-cardhead] {\n      flex-direction:column !important; align-items:flex-start !important;\n      height:auto !important; gap:6px !important; padding:16px 20px !important;\n    }\n\n    /* clipped-gradient text reads muddy at phone sizes; use the flat accent\n       every other page's headline uses */\n    [data-gradtext] {\n      background-image:none !important; -webkit-text-fill-color:#6BA5F7;\n      color:#6BA5F7 !important;\n    }\n\n    /* the demo brings its own gutter; a second one narrows it to 301px */\n    [data-demowrap] { padding-left:0 !important; padding-right:0 !important; padding-bottom:48px !important; }\n\n    /* --- section seams -------------------------------------------------- */\n    [data-logoband] { padding-top:36px !important; padding-bottom:36px !important; }\n    [data-closer] { padding-top:52px !important; }\n    [data-closerband] { margin-top:0 !important; }\n\n    /* --- odds and ends -------------------------------------------------- */\n    /* 15px lockups turn two-line wordmarks into 4px of unreadable type */\n    [data-logos] { gap:26px 28px !important; }\n    [data-logos] img { height:22px !important; }\n    [data-borderx] { border-right:none !important; }\n    [data-photoband] { height:240px !important; }\n    [data-bandcaption] {\n      box-sizing:border-box; padding-bottom:22px !important;\n      background:linear-gradient(180deg, rgba(7,17,32,0) 40%, rgba(7,17,32,.82) 100%);\n    }\n    [data-bandcaption] > span { color:rgba(244,244,246,.78) !important; }\n    [data-pullup] { margin-top:-48px !important; }\n    [data-scrollrow] {\n      overflow-x:auto !important; scrollbar-width:none;\n      scroll-snap-type:x proximity; scroll-padding-inline:0;\n      -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 44px),transparent 100%);\n      mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 44px),transparent 100%);\n    }\n    [data-scrollrow]::-webkit-scrollbar { display:none; }\n    [data-scrollrow] > * { flex:0 0 auto !important; scroll-snap-align:start; }\n\n    /* agenda rows: a 44px time gutter leaves too little for the title */\n    [data-agendarow] { gap:10px !important; }\n    [data-agendarow] > span:first-child { width:auto !important; }\n\n  }\n\n  @media (max-width: 640px) {\n    [data-pad] { padding-left:18px !important; padding-right:18px !important; }\n    [data-sectionpad] { padding-top:44px !important; padding-bottom:44px !important; }\n    [data-lead] { font-size:16.5px !important; }\n    [data-mobilenav] { padding-left:18px !important; padding-right:18px !important; }\n    [data-photoband] ; color:rgba(244,244,246,.55)\"><span>Turns interest into a scoped plan<\u002Fspan><span style=\"color:#F4F4F6; font-weight:500; white-space:nowrap\">Two weeks<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-borderx=\"\" style=\"padding:28px; border-right:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08); display:flex; flex-direction:column\">\n          <div style=\"display:flex; align-items:center; min-height:24px; margin-bottom:16px\"><span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:#6BA5F7\">03<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:23px; font-weight:600; letter-spacing:-.025em; margin-bottom:10px\">Automation Builds<\u002Fdiv>\n          <div style=\"font-size:15.5px; line-height:1.55; color:rgba(244,244,246,.58)\">Custom AI systems for the workflows that eat margin: intake, quoting, scheduling, back office. We build it, run it, and maintain it. They get the output, not another software project.<\u002Fdiv>\n          <div style=\"margin-top:auto; padding-top:22px\"><div style=\"border-top:1px solid rgba(255,255,255,.08); padding-top:14px; display:flex; justify-content:space-between; gap:12px; align-items:baseline; font-size:14px; color:rgba(244,244,246,.55)\"><span>Our engineers, your brand<\u002Fspan><span style=\"color:#F4F4F6; font-weight:500; white-space:nowrap\">Per client<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:28px; background:linear-gradient(180deg, rgba(46,123,234,.10), rgba(46,123,234,0)); display:flex; flex-direction:column\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:24px; margin-bottom:16px\">\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:#6BA5F7\">04<\u002Fspan>\n            <span style=\"font-size:12px; font-weight:500; color:#9CC4F0; background:rgba(46,123,234,.14); border:1px solid rgba(46,123,234,.24); padding:3px 10px; border-radius:100px\">The recurring line<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:23px; font-weight:600; letter-spacing:-.025em; margin-bottom:10px\">Managed AI<\u002Fdiv>\n          <div style=\"font-size:15.5px; line-height:1.55; color:rgba(244,244,246,.58)\">Their AI department, run for them. We deploy across the environment: security policy, data controls, rollout, adoption. Then we manage and optimize it monthly. The way they already consume managed IT.<\u002Fdiv>\n          <div style=\"margin-top:auto; padding-top:22px\"><div style=\"border-top:1px solid rgba(255,255,255,.08); padding-top:14px; display:flex; justify-content:space-between; gap:12px; align-items:baseline; font-size:14px; color:rgba(244,244,246,.55)\"><span>Lands on your monthly invoice<\u002Fspan><span style=\"color:#F4F4F6; font-weight:500; white-space:nowrap\">Recurring<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-pad=\"\" data-logoband=\"\" style=\"max-width:1200px; margin:0 auto; padding:56px 40px 104px; display:flex; flex-direction:column; align-items:center; gap:24px\">\n    <span style=\"font-size:13.5px; color:rgba(244,244,246,.5); text-align:center\">We built, owned and automated these before we sold AI to anyone<\u002Fspan>\n    <div data-logos=\"\" style=\"display:flex; gap:36px; align-items:center; flex-wrap:wrap; justify-content:center; opacity:.55\">\n      <img src=\"e7999047-6a7c-4880-8e27-3427cb1f6fa9\" alt=\"Roofer.com\" style=\"height:18px\">\n      <img src=\"4c517d76-5db7-4532-a039-c20a34e85cd8\" alt=\"AO Swag\" style=\"height:18px\">\n      <img src=\"7621abc9-5d1e-4a35-833e-8719dfdac5d9\" alt=\"Midwest Roof and Solar\" style=\"height:18px\">\n      <img src=\"fa80a78d-31e6-4b9e-be53-b756f4b7fa12\" alt=\"Canopy Roof and Restoration\" style=\"height:18px\">\n      <img src=\"fc636211-42a4-4932-a40a-2a46e4af81eb\" alt=\"Rocket Air Supply\" style=\"height:18px\">\n      <img src=\"a53c71bc-7e05-4b3b-a0cf-b52da4c25f6f\" alt=\"Advanced Trailer\" style=\"height:18px\">\n      <img src=\"1637a7cf-fe96-4fa6-84e5-91721acb3d83\" alt=\"Mirada Capital Group\" style=\"height:18px\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid rgba(255,255,255,.08)\">\n    <div data-pad=\"\" data-sectionpad=\"\" style=\"max-width:1200px; margin:0 auto; padding:104px 40px\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7; margin-bottom:14px\">THE OPPORTUNITY<\u002Fdiv>\n      <h2 data-h2=\"\" style=\"margin:0 0 14px; font-size:50px; font-weight:600; letter-spacing:-.042em; line-height:1.04; max-width:20ch\">Your clients will buy AI from someone.<\u002Fh2>\n      <p data-lead=\"\" style=\"margin:0 0 44px; font-size:18px; line-height:1.55; color:rgba(244,244,246,.58); max-width:58ch\">You own the trust, the access and the contracts. What you do not have is a team that ships AI into production before the client's interest dies. That part is ours, white-labelled, behind your logo.<\u002Fp>\n\n      <div data-cols=\"\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:16px\">\n        <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:14px; padding:28px; background:#0D1B2E; display:flex; flex-direction:column\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(244,244,246,.5); margin-bottom:20px\">WHAT YOU SELL TODAY<\u002Fdiv>\n          <div style=\"padding:13px 0; border-top:1px solid rgba(255,255,255,.07); font-size:16px; color:rgba(244,244,246,.6)\">Helpdesk and support<\u002Fdiv>\n          <div style=\"padding:13px 0; border-top:1px solid rgba(255,255,255,.07); font-size:16px; color:rgba(244,244,246,.6)\">Microsoft 365 seats<\u002Fdiv>\n          <div style=\"padding:13px 0; border-top:1px solid rgba(255,255,255,.07); font-size:16px; color:rgba(244,244,246,.6)\">Backup and security<\u002Fdiv>\n          <div style=\"padding:13px 0; border-top:1px solid rgba(255,255,255,.07); font-size:16px; color:rgba(244,244,246,.6)\">Hardware procurement<\u002Fdiv>\n          <div style=\"margin-top:auto; padding-top:22px; font-size:14px; color:rgba(244,244,246,.5)\">Priced per seat. Flat multiple.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(46,123,234,.3); border-radius:14px; padding:28px; background:linear-gradient(180deg, rgba(46,123,234,.14), rgba(46,123,234,.02)); box-shadow:0 0 60px -24px rgba(46,123,234,.9); display:flex; flex-direction:column\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:#9CC4F0; margin-bottom:20px\">WHAT YOU SELL WITH POLYSHARES<\u002Fdiv>\n          <div style=\"padding:13px 0; border-top:1px solid rgba(255,255,255,.1); font-size:16px; font-weight:500\">AI training, across the book<\u002Fdiv>\n          <div style=\"padding:13px 0; border-top:1px solid rgba(255,255,255,.1); font-size:16px; font-weight:500\">AI readiness assessments<\u002Fdiv>\n          <div style=\"padding:13px 0; border-top:1px solid rgba(255,255,255,.1); font-size:16px; font-weight:500\">Automation builds<\u002Fdiv>\n          <div style=\"padding:13px 0; border-top:1px solid rgba(255,255,255,.1); font-size:16px; font-weight:500\">Managed AI, billed monthly<\u002Fdiv>\n          <div style=\"margin-top:auto; padding-top:22px; font-size:14px; color:#9CC4F0; font-weight:500\">Priced on outcomes. Expanding multiple.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"program\" style=\"border-top:1px solid rgba(255,255,255,.08); background:#0A1626; scroll-margin-top:64px\">\n    <div data-pad=\"\" data-sectionpad=\"\" style=\"max-width:1200px; margin:0 auto; padding:104px 40px\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7; margin-bottom:14px\">HOW THE PARTNERSHIP RUNS<\u002Fdiv>\n      <h2 data-h2=\"\" style=\"margin:0 0 14px; font-size:50px; font-weight:600; letter-spacing:-.042em; line-height:1.04\">Start wide. Go deep where it pays.<\u002Fh2>\n      <p data-lead=\"\" style=\"margin:0 0 44px; font-size:18px; line-height:1.55; color:rgba(244,244,246,.58); max-width:58ch\">You never have to guess which client is ready. Training surfaces it for you.<\u002Fp>\n      <div data-cols=\"\" style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:16px\">\n        <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:14px; background:#0D1B2E; padding:26px\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6BA5F7; letter-spacing:.1em\">01<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; letter-spacing:-.025em; margin:14px 0 10px\">You offer training<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.55; color:rgba(244,244,246,.55)\">To your whole book, at a price that is easy to say yes to. We run the sessions as your team.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:14px; background:#0D1B2E; padding:26px\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6BA5F7; letter-spacing:.1em\">02<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; letter-spacing:-.025em; margin:14px 0 10px\">Demand surfaces<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.55; color:rgba(244,244,246,.55)\">Every session ends with a list of the manual work that hurts most. The serious ones take an assessment.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:14px; background:#0D1B2E; padding:26px\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6BA5F7; letter-spacing:.1em\">03<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; letter-spacing:-.025em; margin:14px 0 10px\">We build<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.55; color:rgba(244,244,246,.55)\">Live in 30 days, under your brand. Your engineers stay on the work they are already good at.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:14px; background:#0D1B2E; padding:26px\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#6BA5F7; letter-spacing:.1em\">04<\u002Fdiv>\n          <div style=\"font-size:21px; font-weight:600; letter-spacing:-.025em; margin:14px 0 10px\">You keep the client<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.55; color:rgba(244,244,246,.55)\">Recurring managed-AI revenue on a relationship you already own. We never sell around you.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid rgba(255,255,255,.08)\">\n    <div data-demowrap=\"\" style=\"max-width:1200px; margin:0 auto; padding:8px 40px 104px\">\n      <dc-import name=\"Interactive Demo\" hint-size=\"100%,1000px\" style=\"display:block\"><\u002Fdc-import>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid rgba(255,255,255,.08); background:#0A1626\">\n    <div data-pad=\"\" data-sectionpad=\"\" data-cols=\"\" style=\"max-width:1200px; margin:0 auto; padding:104px 40px; display:grid; grid-template-columns:.8fr 1.2fr; gap:56px; align-items:start\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7; margin-bottom:14px\">QUESTIONS PARTNERS ASK<\u002Fdiv>\n        <h2 data-h2=\"\" style=\"margin:0; font-size:46px; font-weight:600; letter-spacing:-.04em; line-height:1.05\">The awkward ones, answered.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(255,255,255,.08)\">\n        <div style=\"padding:24px 0; border-bottom:1px solid rgba(255,255,255,.08)\">\n          <div style=\"font-size:18px; font-weight:600; letter-spacing:-.02em; margin-bottom:9px\">Will you go around me and take my client?<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:1.55; color:rgba(244,244,246,.58)\">No. The contract is yours, the invoice is yours, the relationship is yours. We are subcontracted delivery and we sign to that.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-bottom:1px solid rgba(255,255,255,.08)\">\n          <div style=\"font-size:18px; font-weight:600; letter-spacing:-.02em; margin-bottom:9px\">Why start with training instead of a project?<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:1.55; color:rgba(244,244,246,.58)\">Because it costs you nothing to offer and it tells you exactly which clients are ready. Guessing at a first project is how these programs stall.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-bottom:1px solid rgba(255,255,255,.08)\">\n          <div style=\"font-size:18px; font-weight:600; letter-spacing:-.02em; margin-bottom:9px\">Do I need AI engineers on staff?<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:1.55; color:rgba(244,244,246,.58)\">No. That is the point. You bring the client relationship and the operational context, we bring the engineers who ship.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-bottom:1px solid rgba(255,255,255,.08)\">\n          <div style=\"font-size:18px; font-weight:600; letter-spacing:-.02em; margin-bottom:9px\">What does it cost me to start?<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:1.55; color:rgba(244,244,246,.58)\">Nothing up front. No platform fee, no minimums, no exclusivity. Run training with a handful of clients and see what comes back.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-bottom:1px solid rgba(255,255,255,.08)\">\n          <div style=\"font-size:18px; font-weight:600; letter-spacing:-.02em; margin-bottom:9px\">Whose brand is on it?<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:1.55; color:rgba(244,244,246,.58)\">Yours. We show up as your AI team in the room, in the documentation, and in the handover. If you would rather co-brand, that works too.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-bottom:1px solid rgba(255,255,255,.08)\">\n          <div style=\"font-size:18px; font-weight:600; letter-spacing:-.02em; margin-bottom:9px\">Who owns what gets built?<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:1.55; color:rgba(244,244,246,.58)\">The client owns the IP outright at the end of the engagement. No lock-in, nothing rented, which is what makes it an easy sell for you.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0\">\n          <div style=\"font-size:18px; font-weight:600; letter-spacing:-.02em; margin-bottom:9px\">Which of my clients is this for?<\u002Fdiv>\n          <div style=\"font-size:16px; line-height:1.55; color:rgba(244,244,246,.58)\">Non-technical operators doing $5M to $500M: home services, field services, light industrial, healthcare, professional services. Anywhere overhead is the drag on EBITDA.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid rgba(255,255,255,.08)\">\n    <div data-pad=\"\" data-stack=\"\" style=\"max-width:1200px; margin:0 auto; padding:72px 40px; display:flex; justify-content:space-between; align-items:center; gap:32px\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7; margin-bottom:12px\">THINKING ABOUT AN EXIT?<\u002Fdiv>\n        <div style=\"font-size:32px; font-weight:600; letter-spacing:-.03em\">We also buy MSPs.<\u002Fdiv>\n        <div style=\"font-size:16px; line-height:1.55; color:rgba(244,244,246,.55); margin-top:10px; max-width:60ch\">If you would rather hand over the book than build on it, we acquire and operate. Eight acquisitions to date, and we keep the team.<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"https://calendly.com/polyshares/30min\" target=\"_blank\" rel=\"noopener\" style=\"border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.04); padding:13px 22px; font-size:15px; font-weight:500; border-radius:10px; white-space:nowrap; color:#F4F4F6\">Talk to us privately<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative; overflow:hidden; border-top:1px solid rgba(255,255,255,.08)\">\n      <div style=\"position:absolute; inset:0; pointer-events:none; background:radial-gradient(70% 100% at 50% 118%, rgba(46,123,234,.30) 0%, rgba(7,17,32,0) 70%), radial-gradient(46% 80% at 16% 110%, rgba(60,150,255,.16) 0%, rgba(7,17,32,0) 74%)\"><\u002Fdiv>\n      <div style=\"position:absolute; left:50%; bottom:-760px; width:1400px; height:1400px; margin-left:-700px; border-radius:50%; border:1px solid rgba(107,165,247,.12); pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:absolute; left:50%; bottom:-620px; width:1040px; height:1040px; margin-left:-520px; border-radius:50%; border:1px solid rgba(107,165,247,.09); pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size:64px 64px; -webkit-mask-image:radial-gradient(70% 80% at 50% 100%, #000 0%, transparent 76%); mask-image:radial-gradient(70% 80% at 50% 100%, #000 0%, transparent 76%)\"><\u002Fdiv>\n    <div data-pad=\"\" data-closer=\"\" style=\"position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:104px 40px 0; display:flex; flex-direction:column; align-items:center; text-align:center\">\n
