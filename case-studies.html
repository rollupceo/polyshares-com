document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ld kill the sticky header, so clipping moves up to <html> */\n    [data-root] { overflow:visible !important; }\n\n    /* a wrapper between the shell and the header would become the sticky\n       containing block and unstick it at the end of the hero */\n    [data-passthrough] { display:contents; }\n\n    /* --- gutters and vertical rhythm --------------------------------- */\n    [data-pad] { padding-left:20px !important; padding-right:20px !important; }\n    [data-sectionpad] { padding-top:64px !important; padding-bottom:64px !important; }\n    [data-heropad] { padding-top:44px !important; padding-bottom:64px !important; }\n\n    /* --- type scale --------------------------------------------------- */\n    [data-h1] {\n      font-size:clamp(32px, 8.8vw, 46px) !important; line-height:1.05 !important;\n      letter-spacing:-.035em !important; max-width:none !important; text-wrap:balance;\n    }\n    [data-h2] {\n      font-size:clamp(26px, 6.9vw, 34px) !important; line-height:1.1 !important;\n      letter-spacing:-.03em !important; max-width:none !important; text-wrap:balance;\n    }\n    [data-lead] { font-size:17px !important; line-height:1.6 !important; max-width:none !important; }\n    [data-h1] > span { display:block; }\n    [data-statement] {\n      font-size:clamp(26px, 7.1vw, 34px) !important; line-height:1.18 !important;\n      letter-spacing:-.03em !important; max-width:none !important;\n    }\n\n    /* --- sticky header ------------------------------------------------ */\n    [data-topbar] {\n      position:sticky; top:0; z-index:60;\n      background:rgba(7,17,32,.86);\n      -webkit-backdrop-filter:saturate(170%) blur(14px);\n      backdrop-filter:saturate(170%) blur(14px);\n      border-bottom:1px solid rgba(255,255,255,.08) !important;\n    }\n    [data-topbar] [data-pad] > div { height:56px !important; border-bottom:none !important; }\n    [data-topbar] a[href*=\"calendly\"] {\n      padding:0 14px !important; height:42px; box-sizing:border-box;\n      display:inline-flex; align-items:center;\n      font-size:13.5px !important; border-radius:11px !important; white-space:nowrap;\n    }\n    [data-topbar] [data-pad] > div > div:first-child { gap:0 !important; }\n    [data-navlinks], [data-navalt] { display:none !important; }\n    [data-navactions] { gap:10px !important; }\n    [data-topbar] [data-pad] > div > div:first-child > a { min-height:44px; align-items:center; }\n\n    /* small pill controls need a thumb-sized hit area */\n    [data-pillbtn] {\n      box-sizing:border-box; min-height:44px;\n      display:inline-flex !important; align-items:center; justify-content:center;\n    }\n\n    /* the old scrolling link strip is replaced by the menu below */\n    [data-mobilenav] { display:none !important; }\n\n    /* menu button + dropdown (a <details>, so it works without JS) */\n    [data-navmenu] { display:block; }\n    [data-navmenu] > summary {\n      list-style:none; box-sizing:border-box; cursor:pointer;\n      width:42px; height:42px; display:flex; flex-direction:column;\n      align-items:center; justify-content:center; gap:4px;\n      border:1px solid rgba(255,255,255,.16); border-radius:11px;\n      background:rgba(255,255,255,.04);\n    }\n    [data-navmenu] > summary::-webkit-details-marker { display:none; }\n    [data-navmenu] > summary::marker { content:\"\"; }\n    [data-navmenu] > summary > span {\n      display:block; width:16px; height:1.5px; border-radius:2px; background:#F4F4F6;\n      transition:transform .18s ease, opacity .18s ease;\n    }\n    [data-navmenu][open] > summary { background:rgba(46,123,234,.16); border-color:rgba(107,165,247,.45); }\n    [data-navmenu][open] > summary::after {\n      content:\"\"; position:absolute; z-index:55; cursor:default;\n      top:100%; left:-100vw; right:-100vw; height:200vh;\n      background:rgba(4,9,18,.72);\n    }\n    [data-navmenu][open] > summary > span:first-child { transform:translateY(5.5px) rotate(45deg); }\n    [data-navmenu][open] > summary > span:nth-child(2) { opacity:0; }\n    [data-navmenu][open] > summary > span:last-child { transform:translateY(-5.5px) rotate(-45deg); }\n\n    /* opaque, not translucent — page copy showing through the menu was the\n       single ugliest thing on the site */\n    [data-navpanel] {\n      position:absolute; left:0; right:0; top:100%; z-index:62;\n      display:flex; flex-direction:column;\n      padding:6px 20px 18px;\n      background:#080F1D;\n      border-bottom:1px solid rgba(255,255,255,.1);\n      box-shadow:0 30px 40px -18px rgba(0,0,0,.9);\n    }\n    [data-navpanel] > a {\n      display:flex; align-items:center; min-height:54px;\n      font-size:17px; font-weight:500; letter-spacing:-.015em;\n      color:rgba(244,244,246,.82) !important;\n      border-bottom:1px solid rgba(255,255,255,.07);\n    }\n    [data-navpanel] > a[data-current] { color:#9CC4F0 !important; }\n    [data-navpanel] > a[data-navcta] {\n      justify-content:center; margin-top:16px; min-height:52px;\n      background:#2A72DC; color:#fff !important; border-radius:11px;\n      border-bottom:none; font-size:17px; font-weight:600;\n    }\n\n    /* --- grids -------------------------------------------------------- */\n    [data-cols], [data-rail], [data-caserow], [data-timeline] { grid-template-columns:1fr !important; }\n    [data-cols] { gap:20px !important; }\n    [data-cols] > *, [data-caserow] > * { border-right:none !important; }\n\n    /* seamless (gapless) grids keep their hairlines, but horizontal ones */\n    [data-splitgrid] { gap:0 !important; }\n    [data-splitgrid] > * { border-right:none !important; border-bottom:none !important; }\n    [data-splitgrid] > * + * { border-top:1px solid rgba(255,255,255,.08) !important; }\n    [data-caserow] > * + * { border-top:1px solid rgba(255,255,255,.08) !important; }\n\n    /* --- stat rails: 2x2 card, not four tall rows --------------------- */\n    [data-proof], [data-stats] {\n      display:grid !important; grid-template-columns:1fr 1fr !important;\n      width:100% !important; gap:0 !important;\n      border:1px solid rgba(255,255,255,.12) !important; border-radius:14px !important;\n      overflow:hidden !important;\n    }\n    [data-proof] { margin-top:34px !important; }\n    [data-proof] > div, [data-stats] > div {\n      padding:16px 16px 18px !important; text-align:left !important;\n      border-right:1px solid rgba(255,255,255,.09) !important;\n      border-bottom:1px solid rgba(255,255,255,.09) !important;\n    }\n    [data-proof] > div:nth-child(2n), [data-stats] > div:nth-child(2n) { border-right:none !important; }\n    [data-proof] > div:nth-last-child(-n+2), [data-stats] > div:nth-last-child(-n+2) { border-bottom:none !important; }\n    [data-proof] > div > div:first-child { font-size:23px !important; }\n    [data-stats] > div > div:first-child { font-size:30px !important; }\n    [data-stats] > div > div:last-child { font-size:13px !important; margin-top:8px !important; }\n\n    /* --- the four-week rail (home) ------------------------------------ */\n    [data-rail] { border-top:none !important; }\n    [data-rail] > div {\n      padding:24px 0 26px !important;\n      border-top:1px solid rgba(255,255,255,.12) !important;\n    }\n    [data-rail] > div:last-child { padding-bottom:0 !important; }\n    [data-rail] > div > div { max-width:none !important; }\n    [data-rail] > div > div:first-of-type { font-size:36px !important; }\n\n    /* --- CTA rows: stacked, thumb-sized ------------------------------- */\n    [data-stack] { flex-direction:column !important; align-items:stretch !important; }\n    [data-stack] > a, [data-stack] > span[style*=\"border\"] {\n      text-align:center !important; box-sizing:border-box; min-height:50px;\n      display:flex !important; align-items:center; justify-content:center;\n      border-radius:11px !important;\n    }\n    [data-cta-row] { flex-direction:column !important; width:100% !important; align-self:stretch !important; gap:10px !important; }\n    [data-cta-row] > a, [data-cta-row] > span {\n      display:block !important; text-align:center !important;\n      padding:15px 20px !important; font-size:15.5px !important; border-radius:11px !important;\n    }\n\n    /* --- footer -------------------------------------------------------- */\n    [data-footer] {\n      flex-direction:column !important; align-items:flex-start !important;\n      gap:10px !important; margin-top:64px !important;\n    }\n    [data-footer] > div { flex-wrap:wrap !important; gap:0 20px !important; }\n    [data-footer] a, [data-footer] > span { min-height:44px; display:inline-flex; align-items:center; }\n\n    /* --- people cards -------------------------------------------------\n       A portrait beside the bio squeezes the text to ~20 characters a\n       line. Portrait and name share the top row; the bio runs full width\n       underneath, where it reads properly. */\n    [data-person] {\n      display:grid !important;\n      grid-template-columns:auto minmax(0,1fr);\n      grid-template-areas:\"photo name\" \"bio bio\";\n      column-gap:14px !important; row-gap:12px !important;\n      align-items:center !important; padding:18px !important;\n    }\n    [data-person] > img {\n      grid-area:photo; width:60px !important; height:72px !important; border-radius:9px !important;\n    }\n    [data-person] > div { display:contents; }\n    [data-person] > div > div:first-child { grid-area:name; font-size:19px !important; }\n    [data-person] > div > div:last-child {\n      grid-area:bio; margin-top:0 !important; font-size:15px !important; line-height:1.6 !important;\n    }\n    [data-chips] { padding:14px 18px !important; gap:6px !important; }\n\n    /* --- services: leak picker + engagement accordion ------------------- */\n    [data-leakpane] { padding:24px 20px !important; min-height:0 !important; }\n    [data-buildrow] { gap:20px !important; }\n    [data-hours] { text-align:left !important; }\n    [data-hours] > div:nth-child(2) { font-size:38px !important; }\n    [data-hours] > div:last-child { max-width:none !important; }\n    [data-engagementrow] { gap:14px !important; padding:22px 20px !important; }\n    [data-engagementmeta] { text-align:left !important; display:flex; gap:12px; align-items:baseline; }\n    [data-accordionbody] { padding:0 20px 24px !important; }\n\n    /* label above figure — side by side, both wrap into a mess */\n    [data-kv] {\n      flex-direction:column !important; align-items:flex-start !important;\n      gap:2px !important; margin-top:12px !important;\n    }\n\n    /* --- case studies: platform-size switcher --------------------------- */\n    [data-sizebar] { padding:18px 20px !important; }\n    [data-sizepills] { width:100%; gap:8px !important; }\n    [data-sizepills] > span {\n      flex:1 1 0; text-align:center; box-sizing:border-box; min-height:44px;\n      display:inline-flex !important; align-items:center; justify-content:center;\n      font-size:13px !important; padding:0 6px !important; white-space:nowrap;\n    }\n    [data-metriccards] > div { padding:22px !important; }\n    [data-metriccards] > div > div:first-child { font-size:32px !important; letter-spacing:-.02em !important; }\n\n    /* --- card headers: title over label, never squeezed side by side ---- */\n    [data-cardhead] {\n      flex-direction:column !important; align-items:flex-start !important;\n      height:auto !important; gap:6px !important; padding:16px 20px !important;\n    }\n\n    /* clipped-gradient text reads muddy at phone sizes; use the flat accent\n       every other page's headline uses */\n    [data-gradtext] {\n      background-image:none !important; -webkit-text-fill-color:#6BA5F7;\n      color:#6BA5F7 !important;\n    }\n\n    /* the demo brings its own gutter; a second one narrows it to 301px */\n    [data-demowrap] { padding-left:0 !important; padding-right:0 !important; padding-bottom:48px !important; }\n\n    /* --- section seams -------------------------------------------------- */\n    [data-logoband] { padding-top:36px !important; padding-bottom:36px !important; }\n    [data-closer] { padding-top:52px !important; }\n    [data-closerband] { margin-top:0 !important; }\n\n    /* --- odds and ends -------------------------------------------------- */\n    /* 15px lockups turn two-line wordmarks into 4px of unreadable type */\n    [data-logos] { gap:26px 28px !important; }\n    [data-logos] img { height:22px !important; }\n    [data-borderx] { border-right:none !important; }\n    [data-photoband] { height:240px !important; }\n    [data-bandcaption] {\n      box-sizing:border-box; padding-bottom:22px !important;\n      background:linear-gradient(180deg, rgba(7,17,32,0) 40%, rgba(7,17,32,.82) 100%);\n    }\n    [data-bandcaption] > span { color:rgba(244,244,246,.78) !important; }\n    [data-pullup] { margin-top:-48px !important; }\n    [data-scrollrow] {\n      overflow-x:auto !important; scrollbar-width:none;\n      scroll-snap-type:x proximity; scroll-padding-inline:0;\n      -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 44px),transparent 100%);\n      mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 44px),transparent 100%);\n    }\n    [data-scrollrow]::-webkit-scrollbar { display:none; }\n    [data-scrollrow] > * { flex:0 0 auto !important; scroll-snap-align:start; }\n\n    /* agenda rows: a 44px time gutter leaves too little for the title */\n    [data-agendarow] { gap:10px !important; }\n    [data-agendarow] > span:first-child { width:auto !important; }\n\n  }\n\n  @media (max-width: 640px) {\n    [data-pad] { padding-left:18px !important; padding-right:18px !important; }\n    [data-sectionpad] { padding-top:44px !important; padding-bottom:44px !important; }\n    [data-lead] { font-size:16.5px !important; }\n    [data-mobilenav] { padding-left:18px !important; padding-right:18px !important; }\n    [data-photoband] { height:200px !important; }\n    [data-cols] { gap:16px !important; }\n  }\n\n  /* below ~360px (Fold cover screens, older Androids) the wordmark and the\n     CTA collide; the mark alone still reads as the logo */\n  @media (max-width: 359px) {\n    [data-pad] { padding-left:14px !important; padding-right:14px !important; }\n    [data-topbar] [data-pad] > div > div:first-child span { display:none; }\n    [data-topbar] a[href*=\"calendly\"] { font-size:13px !important; padding:0 12px !important; }\n    [data-navpanel] { padding-left:14px; padding-right:14px; }\n    [data-proof] > div, [data-stats] > div { padding:14px 12px 16px !important; }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after {\n      animation-duration:.001ms !important; animation-iteration-count:1 !important;\n      transition-duration:.001ms !important; scroll-behavior:auto !important;\n    }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div data-root=\"\" style=\"background:#071120; color:#F4F4F6; overflow:hidden\">\n\n  <div data-topbar=\"\">\n  <div data-pad=\"\" style=\"max-width:1200px; margin:0 auto; padding:0 40px\">\n    <div style=\"display:flex; align-items:center; justify-content:space-between; height:68px; border-bottom:1px solid rgba(255,255,255,.1)\">\n      <div style=\"display:flex; align-items:center; gap:40px\">\n        <a href=\"index.html\" style=\"display:flex; align-items:center; gap:9px; color:#F4F4F6\"><img src=\"fbd7fb26-daca-4586-b45e-4d6fa15b7559\" alt=\"\" style=\"height:24px; width:24px; flex-shrink:0\"><span style=\"font-size:17px; font-weight:600; letter-spacing:-.03em\">Polyshares<\u002Fspan><\u002Fa>\n        <div data-navlinks=\"\" style=\"display:flex; gap:26px; font-size:14px; font-weight:500; color:rgba(244,244,246,.55)\"><a href=\"services.html\" style=\"color:rgba(244,244,246,.55)\">Services<\u002Fa><span style=\"color:#F4F4F6\">Case Studies<\u002Fspan><a href=\"it-providers.html\" style=\"color:rgba(244,244,246,.55)\">IT Providers<\u002Fa><a href=\"team.html\" style=\"color:rgba(244,244,246,.55)\">Team<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <div data-navactions=\"\" style=\"display:flex; align-items:center; gap:10px\">\n        <a href=\"https://calendly.com/polyshares/30min\" target=\"_blank\" rel=\"noopener\" style=\"background:#2A72DC; color:#fff; padding:9px 16px; font-size:14px; font-weight:500; border-radius:8px\">Book a 30-min call<\u002Fa>\n        <details data-navmenu=\"\">\n          <summary aria-label=\"Open menu\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fsummary>\n          <div data-navpanel=\"\">\n            <a href=\"index.html\">Home<\u002Fa>\n            <a href=\"services.html\">Services<\u002Fa>\n            <a href=\"case-studies.html\" data-current=\"\">Case Studies<\u002Fa>\n            <a href=\"it-providers.html\">IT Providers<\u002Fa>\n            <a href=\"team.html\">Team<\u002Fa>\n            <a href=\"https://calendly.com/polyshares/30min\" target=\"_blank\" rel=\"noopener\" data-navcta=\"\">Book a 30-minute call<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-mobilenav=\"\" style=\"display:none; border-bottom:1px solid rgba(255,255,255,.08); overflow-x:auto; padding:0 22px; gap:20px; align-items:center; height:46px; font-size:14px; font-weight:500; color:rgba(244,244,246,.55); white-space:nowrap\">\n    <a href=\"services.html\">Services<\u002Fa>\n    <span style=\"color:#F4F4F6\">Case Studies<\u002Fspan>\n    <a href=\"it-providers.html\">IT Providers<\u002Fa>\n    <a href=\"team.html\">Team<\u002Fa>\n  <\u002Fdiv>\n\n  <div style=\"position:relative; overflow:hidden\">\n      <div style=\"position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, #0C2444 0%, #0A1B33 42%, #071120 100%)\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; pointer-events:none; background:radial-gradient(78% 62% at 50% 6%, rgba(46,123,234,.22), rgba(7,17,32,0) 68%)\"><\u002Fdiv>\n    <div style=\"position:absolute; left:0; right:0; bottom:0; height:180px; pointer-events:none; background:linear-gradient(180deg, rgba(7,17,32,0), #071120)\"><\u002Fdiv>\n    <div data-pad=\"\" data-heropad=\"\" style=\"position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:84px 40px 120px\">\n      <div style=\"display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); padding:6px 14px; border-radius:100px; font-size:13px; font-weight:500; color:rgba(255,255,255,.82)\">\n        <span style=\"width:6px; height:6px; border-radius:100px; background:#E2A44B; display:inline-block; animation:pulseDot 2.4s ease-in-out infinite\"><\u002Fspan>\n        Case studies\n      <\u002Fdiv>\n      <h1 data-h1=\"\" style=\"margin:26px 0 0; font-size:70px; line-height:1.02; letter-spacing:-.045em; font-weight:600; max-width:16ch\">Real deployments. <span style=\"color:#6BA5F7\">Real numbers at platform scale.<\u002Fspan><\u002Fh1>\n      <p data-lead=\"\" style=\"margin:24px 0 0; max-width:62ch; font-size:19px; line-height:1.55; color:rgba(255,255,255,.68)\">Each one shows per-location impact and what that becomes across a portfolio, because that is the math a sponsor actually underwrites. Set the platform size and every number below moves with it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-photoband=\"\" style=\"position:relative; height:420px; overflow:hidden; border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08)\">\n    <img src=\"2386160e-afac-4805-a65a-876c88124cda\" alt=\"\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.05) brightness(.55)\">\n    <div style=\"position:absolute; inset:0; background:linear-gradient(90deg, rgba(7,17,32,.94) 0%, rgba(7,17,32,.55) 48%, rgba(46,123,234,.22) 100%)\"><\u002Fdiv>\n    <div data-pad=\"\" data-bandcaption=\"\" style=\"position:relative; height:100%; max-width:1200px; margin:0 auto; padding:0 40px; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:34px\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:rgba(244,244,246,.6)\">DEPLOYMENTS INSIDE OPERATING COMPANIES<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-pad=\"\" style=\"max-width:1200px; margin:40px auto 0; position:relative; z-index:2; padding:0 40px\">\n    <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:14px; background:#0D1B2E; box-shadow:0 30px 60px -26px rgba(4,12,24,.5); padding:20px 26px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap\" data-sizebar=\"\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:rgba(244,244,246,.5); margin-bottom:6px\">PLATFORM SIZE<\u002Fdiv>\n        <div style=\"font-size:17px; font-weight:600; letter-spacing:-.025em\">Model it across {{ sizeLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-sizepills=\"\" style=\"display:flex; gap:6px\">\n        <sc-for list=\"{{ sizes }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <span data-pillbtn=\"\" sc-camel-on-click=\"{{ s.pick }}\" style=\"{{ s.style }}\" style-hover=\"border-color:rgba(107,165,247,.5)\">{{ s.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-pad=\"\" style=\"max-width:1200px; margin:0 auto; padding:34px 40px 0; display:flex; flex-direction:column; gap:20px\">\n    <sc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"4\">\n      <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:16px; background:#0D1B2E; overflow:hidden; transition:border-color .25s ease\" style-hover=\"border-color:rgba(107,165,247,.35)\">\n        <div data-caserow=\"\" style=\"display:grid; grid-template-columns:1.35fr 1fr\">\n          <div style=\"padding:30px; border-right:1px solid rgba(255,255,255,.08)\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7\">{{ c.kind }}<\u002Fdiv>\n            <div style=\"font-size:30px; font-weight:600; letter-spacing:-.032em; margin:12px 0 6px\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:14px; color:rgba(244,244,246,.55)\">{{ c.meta }}<\u002Fdiv>\n            <div style=\"font-size:17px; line-height:1.6; color:rgba(244,244,246,.72); margin:20px 0 22px; max-width:46ch\">{{ c.summary }}<\u002Fdiv>\n            <div style=\"border-top:1px solid rgba(255,255,255,.08)\">\n              <sc-for list=\"{{ c.bullets }}\" as=\"b\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; gap:12px; padding:10px 0; font-size:15px; line-height:1.5; color:rgba(244,244,246,.62); border-bottom:1px solid rgba(255,255,255,.05)\"><span style=\"color:#6BA5F7\">—<\u002Fspan><span>{{ b }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:30px; display:flex; flex-direction:column\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(244,244,246,.5)\">{{ c.perLabel }}<\u002Fdiv>\n            <div style=\"font-size:30px; font-weight:600; letter-spacing:-.035em; margin-top:10px\">{{ c.perLocation }}<\u002Fdiv>\n            <div style=\"margin-top:26px; border:1px solid rgba(107,165,247,.24); border-radius:12px; background:linear-gradient(180deg, rgba(46,123,234,.13), rgba(46,123,234,.02)); padding:20px\">\n              <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(180,169,255,.72)\">AT {{ sizeUpper }}<\u002Fdiv>\n              <div data-kv=\"\" style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-top:14px\">\n                <span style=\"font-size:14px; color:rgba(244,244,246,.55)\">EBITDA impact<\u002Fspan>\n ht.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:14px; background:#0D1B2E; padding:26px\">\n        <div style=\"font-size:38px; font-weight:600; letter-spacing:-.04em\">30 days<\u002Fdiv>\n        <div style=\"font-size:15px; line-height:1.55; color:rgba(244,244,246,.55); margin-top:12px\">Kickoff to a bespoke CRM in production, replacing a bloated enterprise platform.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-closerband=\"\" style=\"position:relative; overflow:hidden; border-top:1px solid rgba(255,255,255,.08); margin-top:100px\">\n    <div style=\"position:absolute; inset:0; pointer-events:none; background:radial-gradient(70% 100% at 50% 118%, rgba(46,123,234,.28) 0%, rgba(7,17,32,0) 70%)\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size:64px 64px; -webkit-mask-image:radial-gradient(70% 80% at 50% 100%, #000 0%, transparent 76%); mask-image:radial-gradient(70% 80% at 50% 100%, #000 0%, transparent 76%)\"><\u002Fdiv>\n    <div data-pad=\"\" data-closer=\"\" style=\"position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:100px 40px 0; display:flex; flex-direction:column; align-items:center; text-align:center\">\n      <h2 data-h2=\"\" style=\"margin:0; font-size:52px; font-weight:600; letter-spacing:-.042em; line-height:1.05; max-width:18ch\">What would your case study look like?<\u002Fh2>\n      <p data-lead=\"\" style=\"margin:22px 0 0; max-width:52ch; font-size:18px; line-height:1.55; color:rgba(255,255,255,.62)\">Thirty minutes. We will name your highest-return opportunity and the number attached to it.<\u002Fp>\n      <div data-cta-row=\"\" style=\"display:flex; gap:10px; margin-top:32px\">\n        <a href=\"https://calendly.com/polyshares/30min\" target=\"_blank
