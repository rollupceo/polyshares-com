document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ally leak?<\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.08em; color:rgba(244,244,246,.35)\">PICK A FUNCTION<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-cols=\"\" style=\"display:grid; grid-template-columns:300px 1fr\">\n        <div style=\"border-right:1px solid rgba(255,255,255,.08); padding:12px\">\n          <sc-for list=\"{{ leaks }}\" as=\"leak\" hint-placeholder-count=\"5\">\n            <div sc-camel-on-click=\"{{ leak.pick }}\" style=\"{{ leak.style }}\" style-hover=\"background:rgba(255,255,255,.05)\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px\">\n                <span style=\"font-size:15.5px; font-weight:600; letter-spacing:-.02em\">{{ leak.name }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:{{ leak.tone }}\">{{ leak.hours }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:13px; line-height:1.5; color:rgba(244,244,246,.45); margin-top:4px\">{{ leak.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:28px 30px; min-height:400px\">\n          <div key=\"{{ activeKey }}\" style=\"animation:riseIn .35s ease both\">\n            <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap\">\n              <div>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7; margin-bottom:10px\">WHAT WE BUILD<\u002Fdiv>\n                <div style=\"font-size:27px; font-weight:600; letter-spacing:-.03em; max-width:22ch; line-height:1.15\">{{ active.build }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right\">\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:rgba(244,244,246,.35); margin-bottom:6px\">TYPICAL HOURS BACK \u002F MONTH<\u002Fdiv>\n                <div style=\"font-size:44px; font-weight:600; letter-spacing:-.045em; color:#E2A44B; line-height:1; font-variant-numeric:tabular-nums\">{{ counter }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:rgba(244,244,246,.38); margin-top:8px; max-width:24ch\">Estimate for a $20M to $50M operator. We size yours in the assessment.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <p style=\"margin:18px 0 26px; font-size:16px; line-height:1.6; color:rgba(244,244,246,.6); max-width:62ch\">{{ active.detail }}<\u002Fp>\n\n            <div data-cols=\"\" style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px\">\n              <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:11px; padding:16px; background:rgba(255,255,255,.02)\">\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(244,244,246,.35); margin-bottom:10px\">SYSTEMS TOUCHED<\u002Fdiv>\n                <div style=\"display:flex; flex-wrap:wrap; gap:6px\">\n                  <sc-for list=\"{{ active.systems }}\" as=\"s\" hint-placeholder-count=\"4\">\n                    <span style=\"border:1px solid rgba(255,255,255,.14); border-radius:6px; padding:3px 9px; font-size:12px; color:rgba(244,244,246,.72)\">{{ s }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:11px; padding:16px; background:rgba(255,255,255,.02)\">\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(244,244,246,.35); margin-bottom:10px\">STILL A HUMAN<\u002Fdiv>\n                <div style=\"font-size:14px; line-height:1.55; color:rgba(244,244,246,.62)\">{{ active.human }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid rgba(107,165,247,.28); border-radius:11px; padding:16px; background:linear-gradient(180deg, rgba(46,123,234,.14), rgba(46,123,234,.02))\">\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(180,169,255,.7); margin-bottom:10px\">TIME TO LIVE<\u002Fdiv>\n                <div style=\"font-size:22px; font-weight:600; letter-spacing:-.025em\">{{ active.timeline }}<\u002Fdiv>\n                <div style=\"font-size:13px; line-height:1.5; color:rgba(244,244,246,.5); margin-top:6px\">{{ active.entry }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-pad=\"\" data-sectionpad=\"\" style=\"max-width:1200px; margin:0 auto; padding:100px 40px 0\">\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7; margin-bottom:14px\">THE FOUR ENGAGEMENTS<\u002Fdiv>\n    <h2 data-h2=\"\" style=\"margin:0 0 14px; font-size:46px; font-weight:600; letter-spacing:-.038em; line-height:1.06; max-width:20ch\">Priced on the outcome, not the hour.<\u002Fh2>\n    <p data-lead=\"\" style=\"margin:0 0 44px; font-size:18px; line-height:1.55; color:rgba(244,244,246,.55); max-width:60ch\">Most operators start with the assessment because it costs the least and tells you the most. Nothing stops you skipping straight to a build if you already know the workflow.<\u002Fp>\n\n    <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:16px; overflow:hidden; background:#0D1B2E\">\n      <sc-for list=\"{{ engagements }}\" as=\"e\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ e.toggle }}\" style=\"{{ e.rowStyle }}\" style-hover=\"background:rgba(255,255,255,.03)\">\n          <div data-stack=\"\" style=\"display:flex; align-items:center; gap:24px; padding:24px 28px\">\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:#6BA5F7; width:24px; flex-shrink:0\">{{ e.num }}<\u002Fspan>\n            <div style=\"flex:1; min-width:0\">\n              <div style=\"display:flex; align-items:center; gap:12px; flex-wrap:wrap\">\n                <span style=\"font-size:23px; font-weight:600; letter-spacing:-.028em\">{{ e.name }}<\u002Fspan>\n                <span style=\"{{ e.tagStyle }}\">{{ e.tag }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:15.5px; line-height:1.55; color:rgba(244,244,246,.55); margin-top:6px; max-width:70ch\">{{ e.summary }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:right; flex-shrink:0\">\n              <div style=\"font-size:15px; font-weight:500\">{{ e.term }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:rgba(244,244,246,.42); margin-top:4px\">{{ e.expandLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ e.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:0 28px 26px 76px; animation:riseIn .3s ease both\">\n              <div data-cols=\"\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:28px; border-top:1px solid rgba(255,255,255,.08); padding-top:22px\">\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(244,244,246,.35); margin-bottom:12px\">WHAT YOU GET<\u002Fdiv>\n                  <sc-for list=\"{{ e.deliverables }}\" as=\"d\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex; gap:10px; padding:7px 0; font-size:15px; line-height:1.5; color:rgba(244,244,246,.72)\"><span style=\"color:#6BA5F7\">—<\u002Fspan><span>{{ d }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(244,244,246,.35); margin-bottom:12px\">RIGHT FOR YOU IF<\u002Fdiv>\n                  <div style=\"font-size:15px; line-height:1.6; color:rgba(244,244,246,.62)\">{{ e.fit }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-pad=\"\" data-sectionpad=\"\" style=\"max-width:1200px; margin:0 auto; padding:100px 40px 0\">\n    <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7; margin-bottom:14px\">INSIDE AI TRAINING<\u002Fdiv>\n    <h2 data-h2=\"\" style=\"margin:0 0 14px; font-size:46px; font-weight:600; letter-spacing:-.038em; line-height:1.06; max-width:20ch\">Your team leaves using it, not knowing about it.<\u002Fh2>\n    <p data-lead=\"\" style=\"margin:0 0 32px; font-size:18px; line-height:1.55; color:rgba(244,244,246,.55); max-width:60ch\">No prompt-engineering theory and no vendor tour. We run the session on your workflows, with your files open, and everyone builds something they keep. Pick a role to see the agenda.<\u002Fp>\n\n    <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:16px; background:#0D1B2E; overflow:hidden\">\n      <div data-scrollrow=\"\" style=\"display:flex; border-bottom:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.02)\">\n        <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ r.pick }}\" style=\"{{ r.tabStyle }}\" style-hover=\"background:rgba(255,255,255,.04)\">\n            <div style=\"font-size:15.5px; font-weight:600; letter-spacing:-.02em; white-space:nowrap\">{{ r.name }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:rgba(244,244,246,.45); margin-top:3px; white-space:nowrap\">{{ r.who }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div key=\"{{ roleKey }}\" data-cols=\"\" style=\"display:grid; grid-template-columns:1.25fr 1fr; animation:riseIn .35s ease both\">\n        <div style=\"padding:30px; border-right:1px solid rgba(255,255,255,.08)\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:6px\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7\">SESSION AGENDA · {{ role.length }}<\u002Fdiv>\n            <span sc-camel-on-click=\"{{ togglePlay }}\" style=\"{{ playStyle }}\" style-hover=\"background:rgba(255,255,255,.07)\">{{ playLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:26px; font-weight:600; letter-spacing:-.03em; margin-bottom:20px; max-width:24ch; line-height:1.15\">{{ role.headline }}<\u002Fdiv>\n          <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"{{ b.style }}\">\n              <div style=\"display:flex; gap:16px; align-items:flex-start\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:{{ b.tone }}; width:44px; flex-shrink:0; padding-top:3px\">{{ b.time }}<\u002Fspan>\n                <div style=\"flex:1\">\n                  <div style=\"font-size:16.5px; font-weight:600; letter-spacing:-.02em\">{{ b.title }}<\u002Fdiv>\n                  <div style=\"font-size:14.5px; line-height:1.55; color:rgba(244,244,246,.55); margin-top:4px\">{{ b.body }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"{{ b.dotStyle }}\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:30px; display:flex; flex-direction:column; gap:22px\">\n          <div>\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(244,244,246,.35); margin-bottom:12px\">WHAT THEY WALK OUT WITH<\u002Fdiv>\n            <sc-for list=\"{{ role.outcomes }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; gap:10px; padding:7px 0; font-size:15px; line-height:1.5; color:rgba(244,244,246,.72)\"><span style=\"color:#6BA5F7\">—<\u002Fspan><span>{{ o }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(107,165,247,.24); border-radius:12px; padding:18px; background:linear-gradient(180deg, rgba(46,123,234,.13), rgba(46,123,234,.02)); margin-top:auto\">\n            <div style=\"font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; color:rgba(180,169,255,.72); margin-bottom:10px\">THE TEST WE SET<\u002Fdiv>\n            <div style=\"font-size:15.5px; line-height:1.6; color:rgba(244,244,246,.82)\">{{ role.test }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-photoband=\"\" style=\"position:relative; height:420px; overflow:hidden; border-top:1px solid rgba(255,255,255,.08); border-bottom:1px solid rgba(255,255,255,.08)\">\n    <img src=\"f36ec171-31b2-4873-8b7e-d27e79ee058a\" alt=\"\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.05) brightness(.55)\">\n    <div style=\"position:absolute; inset:0; background:linear-gradient(90deg, rgba(7,17,32,.94) 0%, rgba(7,17,32,.55) 48%, rgba(46,123,234,.22) 100%)\"><\u002Fdiv>\n    <div data-pad=\"\" style=\"position:relative; height:100%; max-width:1200px; margin:0 auto; padding:0 40px; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:34px\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:rgba(244,244,246,.6)\">IN PRODUCTION, NOT IN A PILOT ENVIRONMENT<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-pad=\"\" data-sectionpad=\"\" style=\"max-width:1200px; margin:0 auto; padding:100px 40px\">\n    <div data-cols=\"\" style=\"display:grid; grid-template-columns:.85fr 1.15fr; gap:56px; align-items:start\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:#6BA5F7; margin-bottom:14px\">THE FIRST 30 DAYS<\u002Fdiv>\n        <h2 data-h2=\"\" style=\"margin:0 0 16px; font-size:44px; font-weight:600; letter-spacing:-.038em; line-height:1.06\">You will know it worked before you renew anything.<\u002Fh2>\n        <p style=\"margin:0 0 24px; font-size:17px; line-height:1.6; color:rgba(244,244,246,.55)\">We agree the metric on the intro call. Every week after that you can see where it sits.<\u002Fp>\n        <div style=\"display:flex; gap:10px; align-items:center; font-size:14px; color:rgba(244,244,246,.45)\">\n          <span style=\"width:7px; height:7px; border-radius:100px; background:#E2A44B; display:inline-block; animation:pulseDot 2s ease-in-out infinite\"><\u002Fspan>\n          Live view, week {{ week }} of 4\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:8px; margin-top:20px\">\n          <span sc-camel-on-click=\"{{ stepWeek }}\" style=\"border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:10px 16px; font-size:14px; font-weight:500; cursor:pointer\" style-hover=\"background:rgba(255,255,255,.06)\">Advance a week<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(255,255,255,.09); border-radius:16px; background:#0D1B2E; overflow:hidden\">\n        <div style=\"display:flex; height:6px; background:rgba(255,255,255,.05)\">\n          <span style=\"width:{{ weekPct }}; background:linear-gradient(90deg,#E2A44B,#6BA5F7); transition:width .6s cubic-bezier(.4,0,.2,1); display:block\"><\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ weeks }}\" as=\"w\" hint-placeholder-count=\"4\">\n          <div style=\"{{ w.style }}\">\n            <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px\">\n              <div style=\"display:flex; align-items:baseline; gap:14px\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:{{ w.tone }}\">{{ w.label }}<\u002Fspan>\n                <span style=\"font-size:19px; font-weight:600; letter-spacing:-.025em\">{{ w.title }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:{{ w.tone }}\">{{ w.state }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.55; color:rgba(244,244,246,.55); margin-top:8px; max-width:60ch\">{{ w.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative; overflow:hidden; border-top:1px solid rgba(255,255,255,.08)\">\n    <div style=\"position:absolute; inset:0; pointer-events:none; background:radial-gradient(70% 100% at 50% 118%, rgba(46,123,234,.28) 0%, rgba(7,17,32,0) 70%)\"><\u002Fdiv>\n    <div style=\"position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size:64px 64px; -webkit-mask-image:radial-gradient(70% 80% at 50% 100%, #000 0%, transparent 76%); mask-image:radial-gradient(70% 80% at 50% 100%, #000 0%, transparent 76%)\"><\u002Fdiv>\n    <div data-pad=\"\" style=\"position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:100px 40px 0; display:flex; flex-direction:column; align-items:center; text-align:center\">\n      <h2 data-h2=\"\" style=\"margin:0; font-size:52px; font-weight:600; letter-spacing:-.042em; line-height:1.05; max-width:18ch\">Bring us the workflow you hate.<\u002Fh2>\n      <p data-lead=\"\" style=\"margin:22px 0 0; max-width:52ch; font-size:18px; line-height:1.55; color:rgba(255,255,255,.62)\">Thirty minutes and you will leave with a scope, a timeline and a number.<\u002Fp>\n      <div data-cta-row=\"\" style=\"display:flex; gap:10px; margin-top:32px\">\n        <a href=\"https:\u002F\u002Fcalendly.com\u002Fpolyshares\u002F30min\" target=\"_blank\" rel=\"noopener\" style=\"background:#2E7BEA; color:#fff; padding:14px 24px; font-size:15px; font-weight:500; border-radius:9px\">Book a 30-minute call<\u002Fa>\n        <a href=\"index.html\" style=\"border:1px solid rgba(255,255,255,.2); padding:14px 24px; font-size:15px; font-weight:500; border-radius:9px; color:#F4F4F6\">See a system running<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-pad=\"\" style=\"max-width:1200px; margin:0 auto; padding:0 40px\">\n      <div style=\"margin-top:80px; padding:24px 0; border-top:1px solid rgba(255,255,255,.12); display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap; font-size:13.5px; color:rgba(255,255,255,.45)\">\n        <a href=\"index.html\" style=\"display:flex; align-items:center; gap:8px; color:rgba(255,255,255,.45)\"><img src=\"3253a2ff-9d7c-4cc3-ae39-fdb32caed027\" alt=\"\" style=\"height:24px; width:24px\">© 2026 Polyshares, Inc<\u002Fa>\n        <div style=\"display:flex; gap:24px\">\n          <a href=\"services.html\" style=\"color:rgba(255,255,255,.45)\">Services<\u002Fa>\n          <a href=\"case-studies.html\" style=\"color:rgba(255,255,255,.45)\">Case Studies<\u002Fa>\n          <a href=\"it-providers.html\" style=\"color:rgba(255,255,255,.45)\">IT Providers<\u002Fa>\n          <a href=\"team.html\" style=\"color:rgba(255,255,255,.45)\">Team<\u002Fa>\n          <a href=\"https:\u002F\u002Fwww.linkedin.com\u002Fcompany\u002Fpolyshares\" target=\"_blank\" rel=\"noopener\" style=\"color:rgba(255,255,255,.45)\">LinkedIn<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440}}\">\nconst LEAKS = [\n  { key:'intake', name:'Intake and scheduling', sub:'Calls, forms, inbound leads', hours:140,\n    build:'An intake agent that answers, qualifies and books',\n    detail:'Every inbound call, form and text gets answered on the first ring, qualified against your criteria, and written into the calendar with the notes your team actually needs. After hours included. Nothing sits in a voicemail box until morning.',\n    systems:['Phone system','CRM','Scheduling','SMS','Email'],\n    human:'Anything priced outside your standard band, or a caller who asks for a person.',\n    timeline:'21 days', entry:'Usually the first build we run.' },\n  { key:'quoting', name:'Quoting and estimating', sub:'Takeoffs, pricing, proposals', hours:90,\n    build:'A quoting engine that prices off your own history',\n    detail:'It reads the request, pulls the comparable jobs out of your history, applies your margin rules, and produces the quote in your format. What used to take a senior estimator two hours takes six minutes and comes back consistent across everyone who sells for you.',\n    systems:['ERP','Price book','Job history','CPQ','DocuSign'],\n    human:'Any quote above your approval threshold, and any custom scope with no comparable.',\n    timeline:'30 days', entry:'Best return when you quote more than 100 jobs a month.' },\n  { key:'backoffice', name:'Back office and finance', sub:'AP, coding, close, reporting', hours:170,\n    build:'A month-end close that runs itself to the exceptions',\n    detail:'Invoices coded, receipts matched, accruals drafted, variances explained with the underlying documents attached. Your controller opens a review queue instead of a blank spreadsheet, and close moves from eleven days to three.',\n    systems:['GL','AP inbox','Banking','Payroll','BI'],\n    human:'Sign-off, judgement calls on accruals, anything that moves the P&L materially.',\n    timeline:'30 days', entry:'Pairs well with the assessment.' },\n  { key:'collections', name:'Collections and AR', sub:'Chasing, plans, escalation', hours:70,\n    build:'A collections agent that works the whole ledger',\n    detail:'Every account gets chased on schedule in your tone, negotiates payment plans inside the rules you set, and logs the promise. Only genuine disputes reach a person. Days sales outstanding typically drops by two weeks in the first quarter.',\n    systems:['ERP','Email','SMS','Payments','CRM'],\n    human:'Disputed balances, legal escalation, anything over your write-off threshold.',\n    timeline:'21 days', entry:'Fastest payback of anything we build.' },\n  { key:'reporting', name:'Reporting and visibility', sub:'Dashboards, variance, alerts', hours:55,\n    build:'An operating brain that explains the number, not just shows it',\n    detail:'It reads across the GL, the maintenance logs, the timecards and the purchase history, and tells you why the margin moved, with the work orders already drafted. You stop paying analysts to assemble the story every month.',\n    systems:['GL','MES','Timecards','PO history','Warehouse'],\n    human:'The decision. We never let it approve spend or change a plan on its own.',\n    timeline:'30 days', entry:'Often the second build after an assessment.' }\n];\n\nconst ENGAGEMENTS = [\n  { num:'01', name:'AI Readiness Assessment', tag:'Most people start here', term:'Two weeks',\n    summary:'We map your workflows, systems and data, then hand you a prioritized automation roadmap with the return attached to each line.',\n    deliverables:['A workflow map of how work actually moves, not the org chart','Ranked automation opportunities with hours and dollars attached','A build sequence with cost and timeline per phase','A one-page brief your leadership team can act on'],\n    fit:'You know AI should be doing something in your business but the internal debate has stalled on where to start. Two weeks ends the debate with numbers.' },\n  { num:'02', name:'Automation Builds', tag:'', term:'Live in 30 days',\n    summary:'Custom AI systems for the workflows that eat your margin. We build, run and maintain them, and the code is yours.',\n    deliverables:['A production system running against your real data','Integrations into the tools you already pay for','Documentation, runbooks and the source, transferred to you','Thirty days of tuning after go-live'],\n    fit:'You already know which workflow is bleeding. You want it fixed this quarter, not scoped for next year.' },\n  { num:'03', name:'AI Training', tag:'', term:'Per session',\n    summary:'Role-based training for executives, operators and frontline teams. Your people using AI on your actual work by the end of the session.',\n    deliverables:['Sessions built on your workflows, not generic prompt decks','A prompt and tool library your team keeps','Role-specific playbooks for exec, ops and frontline','Adoption measured 30 days out'],\n    fit:'You have the tools and nobody uses them. Or you are about to roll something out and want it to land.' },\n  { num:'04', name:'Managed AI', tag:'Ongoing', term:'Recurring',\n    summary:'Your AI department, run for you. Deployment, security policy, data controls, rollout and adoption, then managed and optimized monthly.',\n    deliverables:['Environment-wide deployment with security and data policy set','Monthly optimization against the metrics we agreed','New automations added as the business changes','A named team who know your operation'],\n    fit:'You do not want to hire an AI team and you do not want this to decay six months after launch.' }\n];\n\nconst WEEKS = [\n  { label:'WEEK 1', title:'Immerse', body:'We sit with the people doing the work, map the flow end to end, and pick the two workflows with the highest return.', state:'MAPPING' },\n  { label:'WEEK 2', title:'Deploy', body:'The first tool goes live against real data. Not a sandbox, not a pilot environment. Real records, real volume, supervised.', state:'LIVE' },\n  { label:'WEEK 3', title:'Build', body:'Where nothing off the shelf fits your operation, we write it. This is the week most of the custom work lands.', state:'BUILDING' },\n  { label:'WEEK 4', title:'Hand over', body:'Hours saved and roles freed, documented against the metric we set on day one. Code, runbooks and access transfer to you.', state:'YOURS' }\n];\n\nconst ROLES = [\n  { key:'exec', name:'Executive team', who:'Owner, CEO, CFO, GM', length:'HALF DAY',\n    headline:'Where AI changes the P&L, and where it does not.',\n    blocks:[\n      { time:'0:00', title:'The honest state of the tooling', body:'What these models are genuinely good at this quarter, what they still fail at, and how to tell the difference before you buy.' },\n      { time:'0:45', title:'Your own margin map', body:'We take your P&L and mark the lines AI can move. Overhead, throughput, working capital. Numbers, not categories.' },\n      { time:'1:45', title:'Build a decision memo, live', body:'Each executive drafts the AI case for one function in their remit, with the model doing the analysis in front of them.' },\n      { time:'3:00', title:'Policy and risk', body:'Data handling, client confidentiality, what never goes near a model, and what to tell your insurer and your board.' }\n    ],\n    outcomes:['A marked-up P&L showing where AI pays','One decision memo per executive, written in the session','A one-page AI policy your team can adopt Monday','A ranked shortlist of the first three builds'],\n    test:'By the end of the afternoon each of you can name the workflow you are automating first and defend the number attached to it.' },\n  { key:'ops', name:'Operations leads', who:'Managers, controllers, supervisors', length:'FULL DAY',\n    headline:'Rebuild your worst process, in the room.',\n    blocks:[\n      { time:'0:00', title:'Bring your ugliest workflow', body:'Everyone arrives with the process they dread. We map it on the wall in the first hour.' },\n      { time:'1:00', title:'Cut it apart', body:'Which steps are judgement, which are transcription, which exist because the software cannot talk to the other software.' },\n      { time:'2:30', title:'Automate a step for real', body:'Working against a copy of live data, each lead automates one step and runs it against last week\\u2019s volume.' },\n      { time:'4:30', title:'Handover and guardrails', body:'How to write the rule that decides when the system stops and asks a person. This is the part most teams get wrong.' }\n    ],\n    outcomes:['One working automation per lead, running on real data','A documented before-and-after on cycle time','Escalation rules written for each process','A shared library of the prompts and tools that worked'],\n    test:'Every lead demos their automation to the room and states the hours it gives back per week.' },\n  { key:'front', name:'Frontline teams', who:'Service, sales, admin, field', length:'90 MINUTES',\n    headline:'Faster at the job you already do.',\n    blocks:[\n      { time:'0:00', title:'What it is for, plainly', body:'No hype and no fear. Where it helps you, where it will confidently lie to you, and how to catch that.' },\n      { time:'0:20', title:'The five moves', body:'Summarize, draft, extract, compare, explain. Practised on your real emails, quotes, tickets and notes.' },\n      { time:'0:55', title:'Your team\\u2019s own shortcuts', body:'We build saved prompts for the ten tasks your team repeats most, and put them somewhere everyone can reach.' },\n      { time:'1:20', title:'The rules', body:'What never gets pasted into a chat window, and who to ask when you are unsure.' }\n    ],\n    outcomes:['Ten saved prompts for the work this team repeats daily','A one-page reference card that lives at the desk','Clear rules on customer and personal data','A named person on the team who owns questions'],\n    test:'Everyone completes a real task from their own queue in under half the time it took that morning.' }\n];\n\nclass Component extends DCLogic {\n  state = { active: 'intake', counter: 0, open: null, week: 2, role: 'exec', step: -1, playing: false };\n\n  play() {\n    clearInterval(this._tick);\n    if (this.state.playing) { this.setState({ playing:false, step:-1 }); return; }\n    this.setState({ playing:true, step:0 });\n    this._tick = setInterval(() => {\n      this.setState(s => {\n        if (s.step >= 3) { clearInterval(this._tick); return { playing:false, step:-1 }; }\n        return { step: s.step + 1 };\n      });\n    }, 1600);\n  }\n\n  trainingVals() {\n    const role = ROLES.find(r => r.key === this.state.role);\n    const step = this.state.step;\n    return {\n      roleKey: this.state.role, role,\n      roles: ROLES.map(r => {\n        const on = r.key === this.state.role;\n        return { name:r.name, who:r.who, pick: () => { clearInterval(this._tick); this.setState({ role:r.key, step:-1, playing:false }); },\n          tabStyle: 'flex:1; cursor:pointer; padding:16px 22px; transition:background .2s ease; border-bottom:2px solid ' + (on ? '#6BA5F7' : 'transparent') + '; background:' + (on ? 'rgba(46,123,234,.10)' : 'transparent') };\n      }),\n      playLabel: this.state.playing ? 'Stop' : 'Play the session',\n      playStyle: 'cursor:pointer; border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:7px 14px; font-size:13px; font-weight:500; white-space:nowrap; transition:background .2s ease; background:' + (this.state.playing ? 'rgba(46,123,234,.18)' : 'transparent'),\n      togglePlay: () => this.play(),\n      blocks: role.blocks.map((b, i) => {\n        const on = step === i, past = step > i;\n        return { ...b,\n          tone: on ? '#9CC4F0' : 'rgba(244,244,246,.3)',\n          style: 'padding:16px 0; border-top:1px solid rgba(255,255,255,.07); transition:opacity .45s ease, transform .45s ease; opacity:' + (step < 0 ? 1 : on ? 1 : past ? .45 : .3) + '; transform:translateX(' + (on ? '4px' : '0') + ')',\n          dotStyle: 'width:7px; height:7px; border-radius:100px; flex-shrink:0; margin-top:8px; transition:background .3s ease, box-shadow .3s ease; background:' + (on ? '#6BA5F7' : past ? 'rgba(107,165,247,.35)' : 'rgba(255,255,255,.12)') + '; box-shadow:' + (on ? '0 0 0 5px rgba(107,165,247,.16)' : 'none') };\n      })\n    };\n  }\n\n  componentDidMount() { this.animate(LEAKS[0].hours); }\n  componentWillUnmount() { cancelAnimationFrame(this._raf); clearInterval(this._tick); }\n\n  animate(target) {\n    cancelAnimationFrame(this._raf);\n    const from = this.state.counter, t0 = performance.now(), dur = 700;\n    const tick = (t) => {\n      const p = Math.min(1, (t - t0) \u002F dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      this.setState({ counter: Math.round(from + (target - from) * e) });\n      if (p < 1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  pick(l) { if (l.key === this.state.active) return; this.setState({ active: l.key }); this.animate(l.hours); }\n\n  renderVals() {\n    const activeKey = this.state.active;\n    const active = LEAKS.find(l => l.key === activeKey);\n    const week = this.state.week;\n    return {\n      ...this.trainingVals(),\n      activeKey, active,\n      counter: this.state.counter.toLocaleString(),\n      leaks: LEAKS.map(l => {\n        const on = l.key === activeKey;\n        return { ...l, hours: l.hours + ' hrs',\n          tone: on ? '#9CC4F0' : 'rgba(244,244,246,.3)',\n          pick: () => this.pick(l),\n          style: 'cursor:pointer; padding:14px 16px; border-radius:10px; margin-bottom:2px; transition:background .18s ease; border-left:2px solid ' + (on ? '#6BA5F7' : 'transparent') + '; background:' + (on ? 'rgba(46,123,234,.12)' : 'transparent') };\n      }),\n      engagements: ENGAGEMENTS.map((e, i) => {\n        const open = this.state.open === i;\n        return { ...e, open,\n          toggle: () => this.setState({ open: open ? null : i }),\n          expandLabel: open ? 'Close' : 'Details',\n          rowStyle: 'cursor:pointer; transition:background .2s ease; border-bottom:' + (i < ENGAGEMENTS.length - 1 ? '1px solid rgba(255,255,255,.08)' : 'none') + '; background:' + (open ? 'rgba(255,255,255,.03)' : 'transparent'),\n          tagStyle: e.tag ? 'font-size:12px; font-weight:500; color:#9CC4F0; background:rgba(46,123,234,.14); padding:4px 10px; border-radius:100px' : 'display:none' };\n      }),\n      week,\n      weekPct: (week \u002F 4 * 100) + '%',\n      stepWeek: () => this.setState(s => ({ week: s.week % 4 + 1 })),\n      weeks: WEEKS.map((w, i) => {\n        const done = i + 1 < week, now = i + 1 === week;\n        return { ...w,\n          state: done ? 'DONE' : now ? w.state : 'AHEAD',\n          tone: done ? '#E2A44B' : now ? '#9CC4F0' : 'rgba(244,244,246,.28)',\n          style: 'padding:22px 24px; transition:opacity .4s ease, background .4s ease; opacity:' + (done ? .55 : now ? 1 : .32) + '; background:' + (now ? 'rgba(46,123,234,.07)' : 'transparent') + '; border-bottom:' + (i < 3 ? '1px solid rgba(255,255,255,.07)' : 'none') };\n      })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
